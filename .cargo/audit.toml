[advisories]
ignore = [
    # cargo-audit is lockfile-based and reports vulnerable packages that remain
    # in Cargo.lock from image's optional avif/ravif dependency metadata. The
    # feature-aware dependency graph does not enable that path; cargo-deny
    # remains the advisory gate for enabled dependency graphs.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0190: "unsound" advisory for anyhow's `Error::downcast_mut()`
    # (UB only when calling `downcast_mut` on a `.context()`-wrapped error). anyhow
    # is a transitive build-time proc-macro dep (prost-derive via tonic-reflection);
    # rskit never calls `downcast_mut`, and no patched anyhow release exists yet.
    # cargo-deny does not flag this informational advisory; only lockfile-based
    # cargo-audit does. Revisit once a fixed anyhow ships.
    "RUSTSEC-2026-0190",
    # RUSTSEC-2026-0253: "unsound" advisory for `lru`'s `LruCache::pop()` panic
    # safety (use-after-free only when `catch_unwind` is used with key types whose
    # `Drop` can panic). lru is a transitive dependency of aws-sdk-s3, which pins
    # `lru = "^0.16.3"`, so the patched 0.18.2 is out of range without a major SDK
    # bump; the SDK's internal caches use plain key types that cannot trigger the
    # unwinding path. cargo-deny does not flag this informational advisory; only
    # lockfile-based cargo-audit does. Revisit once aws-sdk-s3 allows a fixed lru.
    "RUSTSEC-2026-0253",
]
