[build]
# Pass --cfg docsrs when building documentation so #[cfg_attr(docsrs, ...)]
# attributes are activated on docs.rs.
# Optional local compile cache (sccache 0.15+; install: cargo install sccache).
# NOTE: sccache cannot cache *incremental* builds, so enabling it implies
# CARGO_INCREMENTAL=0 to be effective. That helps cold / cross-branch builds but
# slows the inner edit->rebuild loop, so it is left opt-in. Do NOT combine it
# with Swatinem/rust-cache in CI (they overlap). To enable locally:
#   export CARGO_INCREMENTAL=0
# rustc-wrapper = "sccache"
# rustdocflags = ["--cfg", "docsrs"]   # uncomment when publishing to docs.rs

[alias]
# Convenience aliases
xtcheck = "clippy --workspace -- -D warnings"
xttest  = "test --workspace"
xtdoc   = "doc --workspace --no-deps"
xtdeny  = "deny check"
xtask = "run --package xtask --"

# Linker optimization: use mold on Linux for faster linking.
# Install mold: `sudo apt install mold` (Ubuntu) or `brew install mold` (macOS w/ Homebrew).
# If mold is not available, comment out or remove the [target.'cfg(target_os = "linux")'] section below.
[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS: Apple's default linker (ld-prime, Xcode 15+) is already fast, so no
# linker override is set here. mold/sold no longer support Mach-O, so they are
# not an option on macOS. lld (from `brew install llvm`) can be marginally
# faster on some setups; opt in per-developer by uncommenting below once llvm is
# installed (path is for Apple Silicon; Intel Homebrew uses /usr/local/...).
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]
