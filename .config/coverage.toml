[thresholds]
line = 90.0

[security]
line = 95.0
packages = [
  "rskit-auth",
  "rskit-authz",
  "rskit-encryption",
  "rskit-errors",
  "rskit-resilience",
  "rskit-security",
]

[runner]
clean = "profraw"
exclude_packages = ["rskit-suite"]
html = false
progress_interval_seconds = 10.0
progress_style = "auto"
progress_width = 32

[packages.rskit-testutil]
line = 80.0

[packages.rskit-suite]
line = 80.0

# rskit-process is gated below the workspace default because its llvm-cov *line*
# metric is unreliable for this crate, while region and function coverage
# confirm the reachable logic is well covered:
#   * Multi-line call/closure argument lines report 0 hits even though the
#     enclosing statement provably executes (e.g. the readiness/spawn error
#     constructors run but their bare-identifier argument lines count 0).
#   * The line count is not stable across edits: removing a few dead source
#     lines can shift the reported line denominator and percentage in
#     counter-intuitive ways.
# The only remaining genuinely-uncovered logic is defensive I/O-error handling
# (child.wait/try_wait/kill/write returning unexpected errors) that cannot be
# driven deterministically without fault injection. The threshold still gates
# real regressions (coverage is a signal, not a target).
[packages.rskit-process]
line = 85.0

# rskit-messaging-rabbitmq is gated below the workspace default because its
# remaining uncovered logic is live-broker lapin code (connect, create_channel,
# basic_qos, queue_declare, and consumer task delivery) that cannot be exercised
# without a real RabbitMQ broker, which the no-network unit-test policy forbids.
# All broker-independent logic (config validation, routing, lazy factory wiring,
# receive timeout, event decode) is covered.
[packages.rskit-messaging-rabbitmq]
line = 85.0
