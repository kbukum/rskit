name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: input
    id: crate
    attributes:
      label: Crate
      description: Which rskit crate is affected? (e.g. `rskit-errors`, `rskit-server`)
      placeholder: rskit-<name>
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Crate version
      description: Output of `cargo pkgid -p rskit-<name>`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: rustc
    attributes:
      label: rustc version
      description: Output of `rustc --version`
      placeholder: "rustc 1.85.0 (stable)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / target triple
      placeholder: "x86_64-unknown-linux-gnu / aarch64-apple-darwin"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A minimal, self-contained code snippet that reproduces the issue. A `cargo new` reproducer is ideal.
      render: rust
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / backtraces
      description: Set `RUST_BACKTRACE=1` for full backtraces.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/kbukum/rskit/blob/main/CODE_OF_CONDUCT.md).
          required: true
