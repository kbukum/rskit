version: 2
updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  # ── Cargo (split workspaces: core, contrib, examples) ──────────────────────
  # There is no root Cargo.toml — rskit is a split workspace family. Each entry
  # below is a real Cargo workspace with a committed Cargo.lock, so Dependabot
  # resolves and updates every member crate per workspace. (fuzz/ is dev-only
  # tooling with an untracked lockfile and is intentionally excluded.)
  - package-ecosystem: "cargo"
    directories:
      - "/core"
      - "/contrib"
      - "/examples"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
    groups:
      tokio:
        patterns:
          - "tokio"
          - "tokio-*"
      tracing:
        patterns:
          - "tracing"
          - "tracing-*"
      tower:
        patterns:
          - "tower"
          - "tower-*"
      tonic:
        patterns:
          - "tonic"
          - "tonic-*"
          - "prost"
          - "prost-*"
      hyper:
        patterns:
          - "hyper"
          - "hyper-*"
          - "axum"
          - "axum-*"
      serde:
        patterns:
          - "serde"
          - "serde_*"
      sqlx:
        patterns:
          - "sqlx"
          - "sqlx-*"
      aws:
        patterns:
          - "aws-*"
          - "aws_*"
      otel:
        patterns:
          - "opentelemetry"
          - "opentelemetry-*"
          - "opentelemetry_*"
      tooling:
        patterns:
          - "clippy"
          - "rustfmt"
          - "cargo-deny"
          - "cargo-audit"
          - "cargo-cyclonedx"
      # Security updates always ship in their own PR (fast lane).
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
