name: Bench

# Performance regression detector. Uses github-action-benchmark to compare
# Criterion benchmarks and post results as a PR comment.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples

      - name: Run benchmarks
        run: |
          cargo bench --manifest-path core/Cargo.toml --workspace --bench '*' -- --output-format bencher | tee output.txt
          cargo bench --manifest-path contrib/Cargo.toml --workspace --bench '*' -- --output-format bencher | tee -a output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: '150%'
          summary-always: true
          comment-always: true
          fail-on-alert: false
          external-data-json-path: ./benchmark-data.json
