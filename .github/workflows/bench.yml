name: Bench

# Performance regression detector. Uses github-action-benchmark to compare
# Criterion benchmarks and post results as a PR comment.

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88  # stable
        with:
          toolchain: stable

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples

      - name: Run benchmarks
        run: |
          set -euo pipefail
          : > raw-output.txt
          cargo bench --manifest-path core/Cargo.toml -p rskit-bench --bench metrics -- --quick --output-format bencher | tee -a raw-output.txt
          cargo bench --manifest-path core/Cargo.toml -p rskit-bench --bench core -- --quick --output-format bencher | tee -a raw-output.txt
          awk '/^bench:/ { printf "test rskit_bench_%03d ... %s\n", ++i, $0; next } { print }' raw-output.txt > output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: '150%'
          summary-always: true
          comment-always: true
          fail-on-alert: false
          external-data-json-path: ./benchmark-data.json
