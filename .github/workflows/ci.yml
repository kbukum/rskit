name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-code: ${{ steps.filter.outputs.rust-code }}
      affected: ${{ steps.domains.outputs.affected || 'all' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            rust-code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'Makefile'
              - 'scripts/**'
              - '.cargo/**'
              - '.config/**'
              - 'clippy.toml'
              - 'deny.toml'
              - 'deny.contrib.toml'
              - 'deny.examples.toml'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
      - name: Detect affected domains
        id: domains
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            AFFECTED=$(echo "$CHANGED" | ./scripts/rskit_tool.py domains affected)
          else
            AFFECTED=""
          fi
          if [ -z "$AFFECTED" ]; then
            AFFECTED="all"
          fi
          echo "affected<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$AFFECTED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Affected domains: $AFFECTED"

  # ---------------------------------------------------------------------------
  # Format check (fast gate — runs on stable, no need to pin MSRV here)
  # ---------------------------------------------------------------------------
  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: |
          cd core && cargo fmt --all --check
          cd ../contrib && cargo fmt --all --check
          cd ../examples && cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Clippy (uses the pinned toolchain from rust-toolchain.toml)
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@874b06e0d3f63371f9ddbee43d4c8ebc73021583  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - run: |
          cargo clippy --manifest-path core/Cargo.toml --workspace -- -D warnings
          cargo clippy --manifest-path contrib/Cargo.toml --workspace -- -D warnings
          cargo clippy --manifest-path examples/Cargo.toml --workspace -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests — matrix across OS + declared MSRV and pinned development toolchain
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ["1.91", "1.95"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@874b06e0d3f63371f9ddbee43d4c8ebc73021583  # v2.7.8
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
          workspaces: |
            core
            contrib
            examples
      - uses: taiki-e/install-action@4bc351f7f2614e48088386e2a0ad917ca3a7e4ba  # v2
        with:
          tool: cargo-nextest
      - run: |
          export CARGO="$(rustup which cargo)"
          export RUSTC="$(rustup which rustc)"
          cargo-nextest nextest run --manifest-path core/Cargo.toml --workspace --profile ci
          cargo-nextest nextest run --manifest-path contrib/Cargo.toml --workspace --profile ci
          cargo-nextest nextest run --manifest-path examples/Cargo.toml --workspace --profile ci

  # ---------------------------------------------------------------------------
  # Documentation (ensure no broken intra-doc links)
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@874b06e0d3f63371f9ddbee43d4c8ebc73021583  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - run: |
          cargo doc --manifest-path core/Cargo.toml --workspace --no-deps --document-private-items
          cargo doc --manifest-path contrib/Cargo.toml --workspace --no-deps --document-private-items
          cargo doc --manifest-path examples/Cargo.toml --workspace --no-deps --document-private-items

  # ---------------------------------------------------------------------------
  # Coverage (runs on pinned Linux only, uploads LCOV)
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: "1.95"
          components: llvm-tools-preview
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@874b06e0d3f63371f9ddbee43d4c8ebc73021583  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - uses: taiki-e/install-action@4bc351f7f2614e48088386e2a0ad917ca3a7e4ba  # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Run coverage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/rskit_tool.py coverage --mode coverage --changed --changed-base "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" --line-threshold "${PR_COVERAGE_LINE_THRESHOLD:-70}"
          else
            ./scripts/rskit_tool.py coverage --mode coverage --line-threshold "${COVERAGE_LINE_THRESHOLD:-90}"
          fi
      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v5
        with:
          directory: target/coverage/workspaces
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Release guardrails
  # ---------------------------------------------------------------------------
  guardrails:
    name: Release Guardrails
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - name: Install nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - run: ./scripts/rskit_tool.py check topology
      - run: ./scripts/rskit_tool.py check l7-edges
      - run: ./scripts/rskit_tool.py check public-api

  # ---------------------------------------------------------------------------
  # Supply-chain audit (cargo-deny + cargo-audit)
  # ---------------------------------------------------------------------------
  security:
    name: Security
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@4bc351f7f2614e48088386e2a0ad917ca3a7e4ba  # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Install nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - run: ./scripts/rskit_tool.py release readiness

  # ---------------------------------------------------------------------------
  # Gate: Aggregate status for branch protection
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI Status
    if: always()
    needs: [changes, fmt, clippy, test, docs, guardrails, coverage, security]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=("${{ needs.changes.result }}" \
                   "${{ needs.fmt.result }}" \
                   "${{ needs.clippy.result }}" \
                   "${{ needs.test.result }}" \
                   "${{ needs.docs.result }}" \
                   "${{ needs.guardrails.result }}" \
                   "${{ needs.coverage.result }}" \
                   "${{ needs.security.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::CI failed — one or more jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI checks passed ✓"
