name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  # No paths-ignore here: the required "CI Status" check must report on every
  # PR. The `changes` job skips the Rust jobs when no code changed.
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-code: ${{ steps.filter.outputs.rust-code }}
      rust-src: ${{ steps.filter.outputs.rust-src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            rust-code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'Makefile'
              - 'scripts/**'
              - '.cargo/**'
              - '.config/**'
              - 'clippy.toml'
              - 'deny.toml'
              - 'deny.contrib.toml'
              - 'deny.examples.toml'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            # Actual crate sources — coverage is meaningless for workflow/infra
            # -only changes, and PR-scoped `toven coverage --merge-base` selects
            # zero modules for them (which the pinned binary treats as an error).
            rust-src:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'

  # ---------------------------------------------------------------------------
  # Python repository tooling tests
  # ---------------------------------------------------------------------------
  python-tooling:
    name: Python Tooling
    needs: changes
    if: needs.changes.outputs.rust-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - name: Run Python tooling tests
        run: python3 -m unittest discover -s scripts/tests -t .

  # ---------------------------------------------------------------------------
  # Format check (fast gate — pinned to the repository toolchain)
  # ---------------------------------------------------------------------------
  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
          components: rustfmt
      - run: |
          cd core && cargo fmt --all --check
          cd ../contrib && cargo fmt --all --check
          cd ../examples && cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Clippy (uses the pinned repository toolchain and all features)
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
          components: clippy
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - name: Run clippy (changed packages on PRs, full otherwise)
        run: |
          export CARGO="$(rustup which cargo)"
          export RUSTC="$(rustup which rustc)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/rskit_tool.py ci lint \
              --scope changed \
              --changed-base "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
              --feature-mode all \
              --jobs 3
          else
            ./scripts/rskit_tool.py ci lint --scope all --feature-mode all --jobs 3
          fi

  # ---------------------------------------------------------------------------
  # Tests — behavioral tests on the pinned development toolchain
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }} / 1.97 / ${{ matrix.feature-mode }})
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            feature-mode: default
          - os: ubuntu-latest
            feature-mode: all
          - os: macos-latest
            feature-mode: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2.7.8
        with:
          key: ${{ matrix.os }}-1.97-${{ matrix.feature-mode }}
          workspaces: |
            core
            contrib
            examples
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2
        with:
          tool: cargo-nextest
      - name: Run selected tests
        run: |
          export CARGO="$(rustup which cargo)"
          export RUSTC="$(rustup which rustc)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/rskit_tool.py ci test \
              --scope changed \
              --changed-base "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
              --feature-mode "${{ matrix.feature-mode }}" \
              --profile ci \
              --jobs 3
          else
            ./scripts/rskit_tool.py ci test --scope all --feature-mode "${{ matrix.feature-mode }}" --profile ci --jobs 3
          fi

  # ---------------------------------------------------------------------------
  # MSRV — compile tests on the declared minimum Rust version without
  # duplicating the full behavioral test matrix.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV (ubuntu-latest / 1.97 / ${{ matrix.feature-mode }})
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-mode: [default, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2.7.8
        with:
          key: ubuntu-latest-1.97-msrv-${{ matrix.feature-mode }}
          workspaces: |
            core
            contrib
            examples
      - name: Run selected MSRV checks
        run: |
          export CARGO="$(rustup which cargo)"
          export RUSTC="$(rustup which rustc)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/rskit_tool.py ci msrv \
              --scope changed \
              --changed-base "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
              --feature-mode "${{ matrix.feature-mode }}" \
              --jobs 3
          else
            ./scripts/rskit_tool.py ci msrv --scope all --feature-mode "${{ matrix.feature-mode }}" --jobs 3
          fi

  # ---------------------------------------------------------------------------
  # Documentation (ensure no broken intra-doc links)
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - run: |
          cargo doc --manifest-path core/Cargo.toml --workspace --no-deps --document-private-items
          cargo doc --manifest-path contrib/Cargo.toml --workspace --no-deps --document-private-items
          cargo doc --manifest-path examples/Cargo.toml --workspace --no-deps --document-private-items

  # ---------------------------------------------------------------------------
  # Coverage (runs on pinned Linux only, uploads LCOV)
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    if: needs.changes.outputs.rust-src == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
          components: llvm-tools-preview
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Install the pinned Toven release
        id: toven
        # Pinned by immutable commit SHA; the action installs the Toven release
        # built from that commit (checksum + keyless Sigstore signature verified).
        uses: kbukum/toven/.github/actions/toven@82cd862dc36b942503f62552a9162797bf002ad8 # v0.1.0-alpha.16
      - name: Run coverage
        # Single `toven coverage` entrypoint gated by the floors in toven.toml
        # (line 90%, security-set 95%, per-module floors). On a PR the run is
        # scoped to crates changed against the base and gated at the config's
        # `changed_line` floor; on push it measures and gates the full workspace.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "${{ steps.toven.outputs.toven }}" coverage --base "${{ github.event.pull_request.base.sha }}" --merge-base
          else
            "${{ steps.toven.outputs.toven }}" coverage
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: coverage-debug
          path: target/toven/coverage
          if-no-files-found: ignore
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v5
        with:
          directory: target/toven/coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Release guardrails
  # ---------------------------------------------------------------------------
  guardrails:
    name: Release Guardrails
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
      - name: Install nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Install the pinned Toven release
        id: toven
        # Pinned by immutable commit SHA; the action installs the Toven release
        # built from that commit (checksum + keyless Sigstore signature verified).
        uses: kbukum/toven/.github/actions/toven@82cd862dc36b942503f62552a9162797bf002ad8 # v0.1.0-alpha.16
      - run: '"${{ steps.toven.outputs.toven }}" run topology'
      - run: '"${{ steps.toven.outputs.toven }}" run l7-edges'
      - run: '"${{ steps.toven.outputs.toven }}" run public-api'
      - name: Declare-only aggregator guard
        run: make TOVEN="${{ steps.toven.outputs.toven }}" structure

  # ---------------------------------------------------------------------------
  # Supply-chain audit (cargo-deny + cargo-audit)
  # ---------------------------------------------------------------------------
  security:
    name: Security
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: "1.97"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit
      - name: Install nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Install the pinned Toven release
        id: toven
        uses: kbukum/toven/.github/actions/toven@82cd862dc36b942503f62552a9162797bf002ad8 # v0.1.0-alpha.16
      - run: '"${{ steps.toven.outputs.toven }}" run readiness'

  # ---------------------------------------------------------------------------
  # Gate: Aggregate status for branch protection
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI Status
    if: always()
    needs: [changes, python-tooling, fmt, clippy, test, msrv, docs, guardrails, coverage, security]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=("${{ needs.changes.result }}" \
                   "${{ needs.python-tooling.result }}" \
                   "${{ needs.fmt.result }}" \
                   "${{ needs.clippy.result }}" \
                   "${{ needs.test.result }}" \
                   "${{ needs.msrv.result }}" \
                   "${{ needs.docs.result }}" \
                   "${{ needs.guardrails.result }}" \
                   "${{ needs.coverage.result }}" \
                   "${{ needs.security.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::CI failed — one or more jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI checks passed ✓"
