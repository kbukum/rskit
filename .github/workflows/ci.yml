name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-code: ${{ steps.filter.outputs.rust-code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            rust-code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'Makefile'
              - '.cargo/**'
              - '.config/**'
              - 'clippy.toml'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Format check (fast gate — runs on stable, no need to pin MSRV here)
  # ---------------------------------------------------------------------------
  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  # ---------------------------------------------------------------------------
  # Clippy (uses the pinned toolchain from rust-toolchain.toml)
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: clippy
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b
      - run: cargo clippy --workspace -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests — matrix across OS + MSRV + stable
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ["1.91", "stable"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --profile ci

  # ---------------------------------------------------------------------------
  # Documentation (ensure no broken intra-doc links)
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b
      - run: cargo doc --workspace --no-deps --document-private-items

  # ---------------------------------------------------------------------------
  # Coverage (runs on stable Linux only, uploads LCOV)
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    if: needs.changes.outputs.rust-code == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b
      - uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov --fail-under-lines 60
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          files: coverage.lcov
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Supply-chain audit (cargo-deny + cargo-audit)
  # ---------------------------------------------------------------------------
  security:
    name: Security
    if: needs.changes.outputs.rust-code == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb
        with:
          command: check licenses advisories sources bans
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Benchmarks (smoke — ensure they compile and run)
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmarks (smoke)
    if: needs.changes.outputs.rust-code == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b
      - run: cargo bench --workspace --no-run

  # ---------------------------------------------------------------------------
  # Gate: Aggregate status for branch protection
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI Status
    if: always()
    needs: [changes, fmt, clippy, test, docs, coverage, security, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=("${{ needs.changes.result }}" \
                   "${{ needs.fmt.result }}" \
                   "${{ needs.clippy.result }}" \
                   "${{ needs.test.result }}" \
                   "${{ needs.docs.result }}" \
                   "${{ needs.coverage.result }}" \
                   "${{ needs.security.result }}" \
                   "${{ needs.bench.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::CI failed — one or more jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI checks passed ✓"
