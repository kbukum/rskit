name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-code: ${{ steps.filter.outputs.rust-code }}
      affected: ${{ steps.domains.outputs.affected || 'all' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            rust-code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'Makefile'
              - 'scripts/**'
              - '.cargo/**'
              - '.config/**'
              - 'clippy.toml'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
      - name: Detect affected domains
        id: domains
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            AFFECTED=$(echo "$CHANGED" | ./scripts/affected-domains.sh)
          else
            AFFECTED=""
          fi
          if [ -z "$AFFECTED" ]; then
            AFFECTED="all"
          fi
          echo "affected<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$AFFECTED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Affected domains: $AFFECTED"

  # ---------------------------------------------------------------------------
  # Format check (fast gate — runs on stable, no need to pin MSRV here)
  # ---------------------------------------------------------------------------
  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: |
          cd core && cargo fmt --all --check
          cd ../contrib && cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Clippy (uses the pinned toolchain from rust-toolchain.toml)
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - run: |
          cargo clippy --manifest-path core/Cargo.toml --workspace -- -D warnings
          cargo clippy --manifest-path contrib/Cargo.toml --workspace -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests — matrix across OS + MSRV + stable
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ["1.91", "stable"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b  # v2.7.8
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
          workspaces: |
            core
            contrib
            examples
      - uses: taiki-e/install-action@ec28e287910af896fd98e04056d31fa68607e7ad  # v2
        with:
          tool: cargo-nextest
      - run: |
          export CARGO="$(rustup which cargo)"
          export RUSTC="$(rustup which rustc)"
          cargo-nextest nextest run --manifest-path core/Cargo.toml --workspace --profile ci
          cargo-nextest nextest run --manifest-path contrib/Cargo.toml --workspace --profile ci

  # ---------------------------------------------------------------------------
  # Documentation (ensure no broken intra-doc links)
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - run: |
          cargo doc --manifest-path core/Cargo.toml --workspace --no-deps --document-private-items
          cargo doc --manifest-path contrib/Cargo.toml --workspace --no-deps --document-private-items

  # ---------------------------------------------------------------------------
  # Coverage (runs on stable Linux only, uploads LCOV)
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@919333daf4640a6fca9dd8b87468dc776e46b44b  # v2.7.8
        with:
          workspaces: |
            core
            contrib
            examples
      - uses: taiki-e/install-action@ec28e287910af896fd98e04056d31fa68607e7ad  # v2
        with:
          tool: cargo-llvm-cov
      - run: |
          cargo llvm-cov --manifest-path core/Cargo.toml --workspace --lcov --output-path core-coverage.lcov
          cargo llvm-cov --manifest-path contrib/Cargo.toml --workspace --lcov --output-path contrib-coverage.lcov
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v5
        with:
          files: core-coverage.lcov,contrib-coverage.lcov
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # L7 dependency edge guard
  # ---------------------------------------------------------------------------
  l7-depguard:
    name: L7 Dependency Guard
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - run: ./scripts/check-l7-edges.sh

  # ---------------------------------------------------------------------------
  # Supply-chain audit (cargo-deny + cargo-audit)
  # ---------------------------------------------------------------------------
  security:
    name: Security
    if: needs.changes.outputs.rust-code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb  # v2.0.17
        with:
          command: check licenses advisories sources bans
          manifest-path: core/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb  # v2.0.17
        with:
          command: check licenses advisories sources bans
          manifest-path: contrib/Cargo.toml
      - run: ./scripts/check-l7-edges.sh
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: core
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: contrib

  # ---------------------------------------------------------------------------
  # Gate: Aggregate status for branch protection
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI Status
    if: always()
    needs: [changes, fmt, clippy, test, docs, l7-depguard, coverage, security]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=("${{ needs.changes.result }}" \
                   "${{ needs.fmt.result }}" \
                   "${{ needs.clippy.result }}" \
                   "${{ needs.test.result }}" \
                   "${{ needs.docs.result }}" \
                   "${{ needs.l7-depguard.result }}" \
                   "${{ needs.coverage.result }}" \
                   "${{ needs.security.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::CI failed — one or more jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI checks passed ✓"
