name: Release

# Toven owns the authoritative rskit release. This workflow runs after a GitHub
# Release is published (or via workflow_dispatch for a resume) and drives the
# release-readiness sweep, publish dry-run, SBOM generation, and the idempotent
# crates.io publication through the pinned, checksum-verified Toven binary — the
# `make release-*` targets delegate to it. The general coverage gate stays on the
# native rskit tooling. cargo (deny/audit/cyclonedx/publish) is still installed
# because Toven shells out to it for those steps.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-alpha.1). Must already exist and be reachable from main."
        required: true
        type: string

permissions:
  contents: read

env:
  # Pin the release to an immutable published Toven binary. Bump deliberately.
  TOVEN_VERSION: v0.1.0-alpha.6

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap at 6h. The first release waits out the
    # crates.io new-crate rate budget (~11h for ~69 new crates), so the job may
    # exit here mid-publish; the rate-aware publisher is idempotent, so a
    # workflow_dispatch re-trigger resumes from where it left off.
    timeout-minutes: 350
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - name: Validate release target
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "error: release tag must start with v: ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/tags/"${RELEASE_TAG}":refs/tags/"${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "error: release tag ${RELEASE_TAG} must be reachable from origin/main" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: "1.97"
          components: clippy,rustfmt,llvm-tools-preview
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532  # v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit,cargo-nextest,cargo-llvm-cov,cargo-cyclonedx
      - name: Install nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Install the pinned Toven release
        id: toven
        # Pinned by immutable commit SHA; the `version` input independently pins
        # the installed binary. The action wraps the reference install contract
        # (checksum + keyless Sigstore signature over SHA256SUMS) before use.
        uses: kbukum/toven/.github/actions/toven@6f402bda741196b895bc6fbcb02a34b4065baedb # kbukum/toven install-and-run action
        with:
          version: ${{ env.TOVEN_VERSION }}
      - name: Show the installed Toven version
        run: '"${{ steps.toven.outputs.toven }}" --version'
      - name: Release readiness
        run: make TOVEN="${{ steps.toven.outputs.toven }}" release-readiness
      - name: Coverage thresholds
        run: make release-coverage
      - name: Publish dry-run
        run: make TOVEN="${{ steps.toven.outputs.toven }}" publish-dry-run
      - name: Generate SBOM
        run: make TOVEN="${{ steps.toven.outputs.toven }}" release-sbom
      - name: Sign SBOMs
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(target/sbom/*.cdx.json)
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "error: no SBOM files found in target/sbom" >&2
            exit 1
          fi
          # Keyless signing is per-file and independent, so sign in bounded
          # parallel (8-wide) rather than serially. The bound keeps concurrent
          # Fulcio/Rekor calls well under any throttling while cutting the step
          # from ~72 serial signings to ~1/8 the wall time. `xargs` fails the
          # step if any signing exits non-zero.
          printf '%s\0' "${sboms[@]}" | xargs -0 -P 8 -I {} \
            cosign sign-blob --yes --bundle "{}.bundle" "{}"
      - name: Check crates.io token
        id: crates-token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping crates.io publish because CARGO_REGISTRY_TOKEN is not configured."
          fi
      - name: Publish crates in dependency order
        if: steps.crates-token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make TOVEN="${{ steps.toven.outputs.toven }}" release-publish
      - name: Upload generated assets to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" target/sbom/* --clobber
