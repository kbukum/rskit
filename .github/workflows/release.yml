name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Check Python tooling runtime
        run: python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - name: Validate release target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "error: release tag must start with v: ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/tags/"${RELEASE_TAG}":refs/tags/"${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "error: release tag ${RELEASE_TAG} must be reachable from origin/main" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: "1.95"
          components: clippy,rustfmt,llvm-tools-preview
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest,cargo-llvm-cov,cargo-cyclonedx
      - name: Install nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - name: Install cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.1
      - name: Release readiness
        run: make release-readiness
      - name: Coverage thresholds
        run: make release-coverage
      - name: Publish dry-run
        run: make publish-dry-run
      - name: Generate SBOM
        run: make release-sbom
      - name: Sign SBOMs
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(target/sbom/*.cdx.json)
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "error: no SBOM files found in target/sbom" >&2
            exit 1
          fi
          for file in "${sboms[@]}"; do
            cosign sign-blob --yes --bundle "${file}.bundle" "$file"
          done
      - name: Check crates.io token
        id: crates-token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping crates.io publish because CARGO_REGISTRY_TOKEN is not configured."
          fi
      - name: Publish crates in dependency order
        if: steps.crates-token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/rskit_tool.py release publish-dry-run --publish
      - name: Upload generated assets to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" target/sbom/* --clobber
