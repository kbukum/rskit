[workspace]
resolver = "2"
members = [
    "crates/rskit",
    "crates/rskit-errors",
    "crates/rskit-config",
    "crates/rskit-logging",
    "crates/rskit-bootstrap",
    "crates/rskit-provider",
    "crates/rskit-pipeline",
    "crates/rskit-resilience",
    "crates/rskit-worker",
    "crates/rskit-server",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio      = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"

# Tower middleware stack (tonic 0.13 uses tower 0.4)
tower         = { version = "0.5.3", features = ["full"] }
tower-layer   = "0.3"
tower-service = "0.3"

# Futures / streams
futures      = "0.3"
futures-util = "0.3"
async-stream = "0.3"
pin-project-lite = "0.2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Config loading
config  = { version = "0.15.22", default-features = false, features = ["toml"] }
dotenvy = "0.15"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Resilience
governor = { version = "0.10.4", features = ["std"] }
rand     = "0.10.0"

# gRPC
tonic            = { version = "0.14.5", features = ["transport"] }
tonic-health     = "0.14.5"
tonic-reflection = "0.14.5"
prost            = "0.14.3"

# Utilities
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
async-trait  = "0.1"
parking_lot  = "0.12"
bytes        = "1"
http         = "1"
