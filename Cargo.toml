[workspace]
resolver = "2"
members = [
    # existing
    "crates/rskit-util",
    "crates/rskit",
    "crates/rskit-version",
    "crates/rskit-errors",
    "crates/rskit-config",
    "crates/rskit-logging",
    "crates/rskit-bootstrap",
    "crates/rskit-component",
    "crates/rskit-provider",
    "crates/rskit-pipeline",
    "crates/rskit-resilience",
    "crates/rskit-process",
    "crates/rskit-worker",
    "crates/rskit-chain",
    "crates/rskit-stateful",
    "crates/rskit-server",
    # phase 2 new crates
    "crates/rskit-validation",
    "crates/rskit-encryption",
    "crates/rskit-http",
    "crates/rskit-httpclient",
    "crates/rskit-di",
    "crates/rskit-auth",
    # phase 3 adapters
    "crates/rskit-database",
    "crates/rskit-cache",
    "crates/rskit-messaging",
    "crates/rskit-messaging-kafka",
    "crates/rskit-messaging-nats",
    "crates/rskit-messaging-rabbitmq",
    # phase 4 platform
    "crates/rskit-observability",
    "crates/rskit-authz",
    "crates/rskit-security",
    "crates/rskit-discovery",
    "crates/rskit-git",
    "crates/rskit-grpc",
    "crates/rskit-testutil",
    # phase 5 specialist
    "crates/rskit-sse",
    "crates/rskit-dag",
    "crates/rskit-ai",
    "crates/rskit-llm",
    "crates/rskit-embedding",
    "crates/rskit-inference",
    "crates/rskit-inference-triton",
    "crates/rskit-inference-vllm",
    "crates/rskit-inference-tgi",
    "crates/rskit-vectorstore",
    "crates/rskit-schema",
    "crates/rskit-tool",
    "crates/rskit-skill",
    # phase 5 vendor providers
    "crates/rskit-llm-providers",
    # phase 5 AI modules
    # phase 5 agent/hook modules
    "crates/rskit-hook",
    "crates/rskit-agent",
    # phase 6 media & file
    "crates/rskit-storage",
    "crates/rskit-storage-s3",
    "crates/rskit-storage-gcs",
    "crates/rskit-media",
    "crates/rskit-media-ffmpeg",
    "crates/rskit-media-image",
    "crates/rskit-media-audio",
    # phase 6 MCP bridge
    "crates/rskit-mcp",
    # phase 7 cli, dataset, bench
    "crates/rskit-workload",
    "crates/rskit-cli",
    "crates/rskit-dataset",
    "crates/rskit-bench",
    "crates/workspace-hack",
    # examples
    "examples/agent-demo",
    "examples/media-demo",
    # integration tests
    "crates/rskit-integration",
]

# cargo-fuzz must be excluded from the workspace (it uses a different nightly profile)
exclude = ["fuzz"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
rust-version = "1.91"
authors      = ["kbukum contributors"]
repository   = "https://github.com/kbukum/rskit"
homepage     = "https://github.com/kbukum/rskit"
documentation = "https://docs.rs/rskit"

[workspace.dependencies]
# prefer default-features = false for security-sensitive deps to reduce attack surface (RS-LO-09 / #84)
# Async runtime
tokio      = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"

# Tower middleware stack (tonic 0.13 uses tower 0.4)
tower         = { version = "0.5.3", features = ["full"] }
tower-layer   = "0.3"
tower-service = "0.3"

# Futures / streams
futures      = "0.3"
futures-util = "0.3"
async-stream = "0.3"
pin-project-lite = "0.2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "1.1"

# Config loading
config  = { version = "0.15.22", default-features = false, features = ["toml"] }
dotenvy = "0.15"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Resilience
governor = { version = "0.10.4", features = ["std"] }
rand     = "0.10.1"
zeroize  = { version = "1", features = ["derive"] }

# gRPC
    tonic            = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-health     = "0.14.6"
tonic-reflection = "0.14.6"
prost            = "0.14.3"

# Utilities
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
async-trait  = "0.1"
parking_lot  = "0.12"
bytes        = "1"
http         = "1"
regex        = "1"
once_cell    = "1"
base64       = "0.22"
schemars     = "1"

# HTTP server (Phase 2)
axum         = { version = "0.8", features = ["http2", "ws"] }
tower-http   = { version = "0.6", features = ["cors", "trace", "request-id", "timeout"] }
hyper        = { version = "1", features = ["full"] }
hyper-util   = { version = "0.1", features = ["tokio"] }

# Auth (Phase 2)
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2       = "0.5"

# Database (Phase 3)
sqlx         = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "uuid", "chrono", "json"] }

# Cache (Phase 3)
redis        = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# Messaging adapters (Phase 3)
rdkafka      = { version = "0.39", features = ["tokio"] }
async-nats   = "0.47"
lapin        = { version = "3", default-features = false, features = ["rustls"] }

# Observability (Phase 4)
opentelemetry            = "0.31"
opentelemetry_sdk        = { version = "0.31", features = ["rt-tokio", "logs"] }
opentelemetry-otlp       = { version = "0.31", features = ["grpc-tonic", "metrics", "logs", "http-proto"] }
opentelemetry-appender-tracing = "0.31"
opentelemetry-prometheus = "0.31.0"
prometheus               = "0.14.0"
tracing-opentelemetry    = "0.32"

# HTTP client (shared)
reqwest      = { version = "0.13", features = ["json", "rustls", "http2", "query"], default-features = false }

# Concurrent hash map (discovery)
dashmap      = "6"

# File I/O (rskit-storage)
tempfile     = "3"
mime_guess   = "2"
infer        = "0.19"
futures-core = "0.3"

# Image processing (rskit-media-image)
image        = "0.25"
webp         = "0.3"

# FFmpeg binary lookup (rskit-media-ffmpeg)
which        = "8"

# CLI progress bars (rskit-cli)
indicatif    = "0.18"
crossterm    = "0.28"

# Benchmarking & snapshot testing
criterion    = { version = "0.8", features = ["html_reports", "async_tokio"] }
insta        = { version = "1.47", features = ["json", "yaml", "redactions"] }

# Internal path crates
rskit-ai = { path = "crates/rskit-ai", version = "0.1.0" }


[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow common patterns that are overly noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"

[profile.release]
lto           = true
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Toolchain hygiene: see issues #85 (RS-LO-16 through RS-LO-20) for remaining low findings

[profile.bench]
lto           = "thin"
codegen-units = 1
