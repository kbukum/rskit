[workspace]
resolver = "2"
members = [
    # existing
    "crates/rskit",
    "crates/rskit-errors",
    "crates/rskit-config",
    "crates/rskit-logging",
    "crates/rskit-bootstrap",
    "crates/rskit-provider",
    "crates/rskit-pipeline",
    "crates/rskit-resilience",
    "crates/rskit-process",
    "crates/rskit-worker",
    "crates/rskit-chain",
    "crates/rskit-server",
    # phase 2 new crates
    "crates/rskit-validation",
    "crates/rskit-encryption",
    "crates/rskit-http",
    "crates/rskit-httpclient",
    "crates/rskit-di",
    "crates/rskit-auth",
    # phase 3 adapters
    "crates/rskit-database",
    "crates/rskit-cache",
    "crates/rskit-messaging",
    # phase 4 platform
    "crates/rskit-observability",
    "crates/rskit-authz",
    "crates/rskit-discovery",
    "crates/rskit-grpc-client",
    "crates/rskit-testutil",
    # phase 5 specialist
    "crates/rskit-sse",
    "crates/rskit-dag",
    "crates/rskit-llm",
    "crates/rskit-embedding",
    "crates/rskit-inference",
    "crates/rskit-vector-store",
    "crates/rskit-schema",
    "crates/rskit-tool",
    # phase 5 vendor providers
    "crates/rskit-llm-providers",
    # phase 5 AI modules
    "crates/rskit-explain",
    # phase 5 agent/hook modules
    "crates/rskit-hook",
    "crates/rskit-agent",
    # phase 6 media & file
    "crates/rskit-file",
    "crates/rskit-file-s3",
    "crates/rskit-media",
    "crates/rskit-media-ffmpeg",
    "crates/rskit-media-image",
    "crates/rskit-media-audio",
    # phase 6 MCP bridge
    "crates/rskit-mcp",
    # phase 7 cli, dataset, bench
    "crates/rskit-cli",
    "crates/rskit-dataset",
    "crates/rskit-bench",
    # examples
    "examples/agent-demo",
    "examples/media-demo",
    # integration tests
    "crates/rskit-integration",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
rust-version = "1.85"
authors      = ["kbukum contributors"]
repository   = "https://github.com/kbukum/rskit"
homepage     = "https://github.com/kbukum/rskit"
documentation = "https://docs.rs/rskit"

[workspace.dependencies]
# Async runtime
tokio      = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"

# Tower middleware stack (tonic 0.13 uses tower 0.4)
tower         = { version = "0.5.3", features = ["full"] }
tower-layer   = "0.3"
tower-service = "0.3"

# Futures / streams
futures      = "0.3"
futures-util = "0.3"
async-stream = "0.3"
pin-project-lite = "0.2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# Config loading
config  = { version = "0.15.22", default-features = false, features = ["toml"] }
dotenvy = "0.15"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Resilience
governor = { version = "0.10.4", features = ["std"] }
rand     = "0.10.0"

# gRPC
tonic            = { version = "0.14.5", features = ["transport"] }
tonic-health     = "0.14.5"
tonic-reflection = "0.14.5"
prost            = "0.14.3"

# Utilities
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
async-trait  = "0.1"
parking_lot  = "0.12"
bytes        = "1"
http         = "1"
regex        = "1"
once_cell    = "1"
base64       = "0.22"
schemars     = "1"

# HTTP server (Phase 2)
axum         = { version = "0.8", features = ["http2", "ws"] }
tower-http   = { version = "0.6", features = ["cors", "trace", "request-id", "timeout"] }
hyper        = { version = "1", features = ["full"] }
hyper-util   = { version = "0.1", features = ["tokio"] }

# Auth (Phase 2)
jsonwebtoken = "9"
argon2       = "0.5"

# Database (Phase 3)
sqlx         = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "uuid", "chrono", "json"] }

# Cache (Phase 3)
redis        = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Messaging (Phase 3)
rdkafka      = { version = "0.39", features = ["tokio"] }

# Observability (Phase 4)
opentelemetry            = "0.27"
opentelemetry_sdk        = { version = "0.27", features = ["rt-tokio", "logs"] }
opentelemetry-otlp       = { version = "0.27", features = ["grpc-tonic", "metrics", "logs", "http-proto"] }
opentelemetry-appender-tracing = "0.27"
opentelemetry-prometheus = "0.27"
prometheus               = "0.13"
tracing-opentelemetry    = "0.28"

# HTTP client (shared)
reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Concurrent hash map (discovery)
dashmap      = "6"

# File I/O (rskit-file)
tempfile     = "3"
mime_guess   = "2"
infer        = "0.19"
futures-core = "0.3"

# Image processing (rskit-media-image)
image        = "0.25"
webp         = "0.3"

# FFmpeg binary lookup (rskit-media-ffmpeg)
which        = "7"

# CLI progress bars (rskit-cli)
indicatif    = "0.17"
crossterm    = "0.28"

# Benchmarking & snapshot testing
criterion    = { version = "0.5", features = ["html_reports", "async_tokio"] }
insta        = { version = "1.42", features = ["json", "yaml", "redactions"] }


[profile.release]
lto           = true
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = true
