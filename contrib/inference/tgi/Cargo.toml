[package]
name        = "rskit-inference-tgi"
description = "Hugging Face TGI REST adapter for rskit-inference"
version = "0.1.0-alpha.1"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-inference-tgi"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["inference", "tgi", "ai"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-ai = { workspace = true }
rskit-component.workspace = true
rskit-errors.workspace = true
rskit-httpclient.workspace = true
rskit-inference.workspace = true
rskit-provider.workspace = true
rskit-tool.workspace = true
rskit-util.workspace = true
async-trait     = { workspace = true }
reqwest         = { workspace = true, features = ["json"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
tokio-stream    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
