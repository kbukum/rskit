[package]
name        = "rskit-llm-common"
description = "Shared LLM provider parsing and error utilities for rskit"
readme      = "README.md"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-llm-common"
categories             = ["api-bindings"]
keywords               = ["llm", "provider", "parsing", "ai"]

[lints]
workspace = true

[dependencies]
rskit-ai.workspace = true
rskit-errors.workspace = true
rskit-httpclient.workspace = true
rskit-llm.workspace = true
rskit-observability.workspace = true
rskit-resilience.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
