[package]
name        = "rskit-media-audio"
description = "Pure Rust audio processing backend — WAV I/O, waveform, silence detection, loudness"
version = "0.2.0-alpha.2"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-media-audio"
readme                 = "README.md"
categories             = ["multimedia", "multimedia::audio"]
keywords               = ["audio", "wav", "waveform", "loudness", "silence"]

[dependencies]
rskit-errors.workspace = true
rskit-storage.workspace = true
rskit-media.workspace = true
bytes        = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }

[dev-dependencies]
tokio  = { workspace = true, features = ["test-util", "full"] }
bytes  = { workspace = true }
insta  = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
