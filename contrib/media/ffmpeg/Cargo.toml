[package]
name        = "rskit-media-ffmpeg"
description = "FFmpeg CLI backend for video/audio processing"
version = "0.2.0-alpha.4"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-media-ffmpeg"
readme                 = "README.md"
categories             = ["multimedia", "asynchronous"]
keywords               = ["ffmpeg", "video", "audio", "transcoding"]

[dependencies]
rskit-errors.workspace = true
rskit-fs.workspace = true
rskit-storage.workspace = true
rskit-media.workspace = true
rskit-process.workspace = true
tokio        = { workspace = true, features = ["process", "io-util", "sync", "time"] }
tokio-util   = { workspace = true, features = ["rt"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
bytes        = { workspace = true }
parking_lot  = { workspace = true }
which = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }
insta = { workspace = true }
serde_json = { workspace = true }
rskit-storage.workspace = true
rskit-media.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
