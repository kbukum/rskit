[package]
name        = "rskit-messaging-kafka"
description = "Kafka adapter for rskit-messaging"
version = "0.1.0-alpha.1"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-messaging-kafka"
readme                 = "README.md"
categories             = ["asynchronous"]
keywords               = ["kafka", "messaging", "producer", "consumer"]

[lints]
workspace = true

[dependencies]
rskit-errors.workspace = true
rskit-messaging.workspace = true
async-trait     = { workspace = true }
rdkafka         = { workspace = true }
serde           = { workspace = true }
tokio-stream    = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
