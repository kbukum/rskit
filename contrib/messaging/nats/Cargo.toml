[package]
name        = "rskit-messaging-nats"
description = "NATS adapter for rskit-messaging"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-messaging-nats"
readme                 = "README.md"
categories             = ["asynchronous"]
keywords               = ["nats", "messaging", "producer", "consumer"]

[lints]
workspace = true

[dependencies]
rskit-errors.workspace = true
rskit-messaging.workspace = true
async-nats      = { workspace = true }
async-trait     = { workspace = true }
bytes           = { workspace = true }
futures-util    = { workspace = true }
parking_lot     = { workspace = true }
serde           = { workspace = true }
tokio           = { workspace = true }
tokio-util      = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
