[package]
name        = "rskit-messaging-rabbitmq"
description = "RabbitMQ adapter for rskit-messaging"
version = "0.2.0-alpha.4"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-messaging-rabbitmq"
readme                 = "README.md"
categories             = ["asynchronous"]
keywords               = ["rabbitmq", "amqp", "messaging", "consumer"]

[lints]
workspace = true

[dependencies]
rskit-errors.workspace = true
rskit-messaging.workspace = true
rskit-stream.workspace = true
async-trait     = { workspace = true }
futures-util    = { workspace = true }
lapin           = { workspace = true }
parking_lot     = { workspace = true }
serde           = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
