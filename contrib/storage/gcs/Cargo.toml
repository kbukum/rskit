[package]
name        = "rskit-storage-gcs"
description = "Google Cloud Storage backend for rskit-storage"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-storage-gcs"
readme                 = "README.md"
categories             = ["filesystem", "asynchronous", "web-programming"]
keywords               = ["gcs", "google-cloud", "storage", "async", "file"]

[lints]
workspace = true

[dependencies]
rskit-errors.workspace = true
rskit-storage.workspace = true
async-trait   = { workspace = true }
bytes         = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
google-cloud-storage = { workspace = true }
google-cloud-auth = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["test-util", "full"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
