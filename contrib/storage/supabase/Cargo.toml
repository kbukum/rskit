[package]
name        = "rskit-storage-supabase"
description = "Supabase Storage backend for rskit-storage"
version = "0.2.0-alpha.1"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-storage-supabase"
readme                 = "README.md"
categories             = ["filesystem", "asynchronous", "web-programming"]
keywords               = ["supabase", "storage", "async", "file"]

[lints]
workspace = true

[dependencies]
rskit-errors = { workspace = true }
rskit-storage = { workspace = true }
rskit-util = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
url = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
