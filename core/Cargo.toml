[workspace]
resolver = "2"
members = [
    "rskit-util",
    "rskit",
    "rskit-version",
    "rskit-errors",
    "rskit-config",
    "rskit-logging",
    "rskit-bootstrap",
    "rskit-component",
    "rskit-provider",
    "rskit-pipeline",
    "rskit-resilience",
    "rskit-process",
    "rskit-worker",
    "rskit-chain",
    "rskit-stateful",
    "rskit-server",
    "rskit-validation",
    "rskit-encryption",
    "rskit-http",
    "rskit-httpclient",
    "rskit-di",
    "rskit-auth",
    "rskit-database",
    "rskit-cache",
    "rskit-messaging",
    "rskit-observability",
    "rskit-authz",
    "rskit-security",
    "rskit-discovery",
    "rskit-git",
    "rskit-grpc",
    "rskit-testutil",
    "rskit-sse",
    "rskit-dag",
    "rskit-ai",
    "rskit-llm",
    "rskit-embedding",
    "rskit-inference",
    "rskit-vectorstore",
    "rskit-schema",
    "rskit-tool",
    "rskit-skill",
    "rskit-hook",
    "rskit-agent",
    "rskit-storage",
    "rskit-media",
    "rskit-mcp",
    "rskit-cli",
    "rskit-dataset",
    "rskit-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"
authors = ["kbukum contributors"]
repository = "https://github.com/kbukum/rskit"
homepage = "https://github.com/kbukum/rskit"
documentation = "https://docs.rs/rskit"

[workspace.dependencies]
# prefer default-features = false for security-sensitive deps to reduce attack surface (RS-LO-09 / #84)
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"

# Tower middleware stack (tonic 0.13 uses tower 0.4)
tower = { version = "0.5.3", features = ["full"] }
tower-layer = "0.3"
tower-service = "0.3"

# Futures / streams
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
pin-project-lite = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "1.1"

# Config loading
config = { version = "0.15.22", default-features = false, features = ["toml"] }
dotenvy = "0.15"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Resilience
governor = { version = "0.10.4", features = ["std"] }
rand = "0.10.1"
zeroize = { version = "1", features = ["derive"] }

# gRPC
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.3"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
parking_lot = "0.12"
bytes = "1"
http = "1"
libc = "0.2"
regex = "1"
once_cell = "1"
base64 = "0.22"
schemars = "1"
jsonschema = { version = "0.46.5", default-features = false }

# HTTP server (Phase 2)
axum = { version = "0.8", features = ["http2", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
rustls = "0.23.40"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.4"

# Auth (Phase 2)
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = { version = "0.5", features = ["password-hash", "rand"] }

# Observability (Phase 4)
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "metrics", "logs", "http-proto"] }
opentelemetry-appender-tracing = "0.31"
opentelemetry-prometheus = "0.31.0"
prometheus = "0.14.0"
tracing-opentelemetry = "0.32"

# HTTP client (shared)
reqwest = { version = "0.13", features = ["json", "rustls", "http2", "query"], default-features = false }

# Concurrent hash map (discovery)
dashmap = "6"

# File I/O (rskit-storage)
tempfile = "3"
mime_guess = "2"
infer = "0.19"
futures-core = "0.3"
sha2 = "0.11"

# CLI progress bars (rskit-cli)
indicatif = "0.18"
crossterm = "0.28"

# Benchmarking & snapshot testing
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
insta = { version = "1.47", features = ["json", "yaml", "redactions"] }

# Internal path crates
rskit-ai = { path = "rskit-ai" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
