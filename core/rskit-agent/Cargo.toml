[package]
name        = "rskit-agent"
description = "Agentic loop — Provider + Tools + Hooks in a turn-based execution engine"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-agent"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["agent", "llm", "tool", "loop"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
async-trait  = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
futures      = { workspace = true }
async-stream = { workspace = true }
tracing      = { workspace = true }
parking_lot  = { workspace = true }

# Internal
rskit-ai = { workspace = true }
rskit-component = { path = "../rskit-component" }
rskit-errors   = { path = "../rskit-errors" }
rskit-llm      = { path = "../rskit-llm" }
rskit-provider = { path = "../rskit-provider" }
rskit-resilience = { path = "../rskit-resilience" }
rskit-tool     = { path = "../rskit-tool" }
rskit-hook     = { path = "../rskit-hook" }

[dev-dependencies]
schemars     = { workspace = true }
