[package]
name        = "rskit-agent"
description = "Agentic loop — Provider + Tools + Hooks in a turn-based execution engine"
version = "0.2.0-alpha.1"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-agent"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["agent", "llm", "tool", "loop"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
async-trait  = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
futures      = { workspace = true }
async-stream = { workspace = true }
tracing      = { workspace = true }
parking_lot  = { workspace = true }

# Internal
rskit-ai = { workspace = true }
rskit-component = { workspace = true }
rskit-errors = { workspace = true }
rskit-llm = { workspace = true }
rskit-observability = { workspace = true }
rskit-provider = { workspace = true }
rskit-resilience = { workspace = true }
rskit-tool = { workspace = true }
rskit-hook = { workspace = true }

[dev-dependencies]
schemars     = { workspace = true }

[lints]
workspace = true
