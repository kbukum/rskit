[package]
name        = "rskit-auth"
description = "JWT, OIDC, password hashing, and request-context auth helpers"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-auth"
readme = "README.md"
categories = ["authentication"]
keywords   = ["auth", "jwt", "oidc", "password"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde         = { workspace = true }
serde_json    = { workspace = true }
async-trait   = { workspace = true }
tokio         = { workspace = true }
jsonwebtoken  = { workspace = true }
argon2        = { version = "0.5", features = ["std"] }
rand          = { workspace = true }
base64        = "0.22"
chrono        = { workspace = true }
uuid          = { workspace = true }
sha2          = "0.11"
hmac          = "0.13"
subtle        = "2.6"
hex           = "0.4"
thiserror     = { workspace = true }
tower         = "0.5"
http          = "1.0"
zeroize       = { workspace = true }
reqwest       = { workspace = true }

# Internal
rskit-errors  = { path = "../rskit-errors" }
rskit-config  = { path = "../rskit-config" }
rskit-httpclient = { path = "../rskit-httpclient" }
rskit-util = { path = "../rskit-util" }

[dev-dependencies]
tokio         = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
serde_json    = { workspace = true }
chrono        = { workspace = true }
parking_lot   = { workspace = true }
