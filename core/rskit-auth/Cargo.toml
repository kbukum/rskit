[package]
name        = "rskit-auth"
description = "JWT, OIDC, password hashing, and request-context auth helpers"
version = "0.1.0-alpha.2"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-auth"
readme = "README.md"
categories = ["authentication"]
keywords   = ["auth", "jwt", "oidc", "password"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
jwt = ["dep:jsonwebtoken"]
oidc = ["dep:jsonwebtoken", "dep:reqwest", "dep:rskit-httpclient"]

[dependencies]
# External
serde         = { workspace = true }
serde_json    = { workspace = true }
async-trait   = { workspace = true }
tokio         = { workspace = true }
jsonwebtoken  = { workspace = true, optional = true }
argon2 = { workspace = true, features = ["std"] }
rand          = { workspace = true }
base64 = { workspace = true }
chrono        = { workspace = true }
uuid          = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
thiserror     = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
zeroize       = { workspace = true }
reqwest       = { workspace = true, optional = true }

# Internal
rskit-errors = { workspace = true }
rskit-config = { workspace = true }
rskit-httpclient = { workspace = true, optional = true }
rskit-security = { workspace = true }
rskit-util = { workspace = true }

[dev-dependencies]
tokio         = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
serde_json    = { workspace = true }
chrono        = { workspace = true }
parking_lot   = { workspace = true }

[[test]]
name = "credentials_jwt_behavior"
required-features = ["jwt"]

[[test]]
name = "integration"
required-features = ["jwt"]

[[test]]
name = "security_audit"
required-features = ["jwt"]
