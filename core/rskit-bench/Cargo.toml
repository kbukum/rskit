[package]
name        = "rskit-bench"
description = "ML benchmarking framework: evaluators, metrics, reports, visualization"
version = "0.2.0-alpha.5"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-bench"
readme                 = "README.md"
categories             = ["development-tools::testing"]
keywords               = ["benchmark", "evaluation", "metrics", "ml"]

[dependencies]
# External
serde          = { workspace = true }
serde_json     = { workspace = true }
futures        = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
tracing        = { workspace = true }
async-trait    = { workspace = true }
parking_lot    = { workspace = true }
rand           = { workspace = true }
rand_chacha    = { workspace = true }
semver         = { workspace = true }
uuid           = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-fs = { workspace = true }
rskit-ai = { workspace = true }
rskit-embedding = { workspace = true }
rskit-llm = { workspace = true }
rskit-provider = { workspace = true }
rskit-resilience = { workspace = true }
rskit-util = { workspace = true }
rskit-worker = { workspace = true }
rskit-cli = { workspace = true }
rskit-observability = { workspace = true }

[dev-dependencies]
tokio     = { workspace = true, features = ["test-util", "full"] }
tempfile  = { workspace = true }
insta     = { workspace = true }
criterion = { workspace = true }
rskit-testutil = { workspace = true, features = ["embedding", "llm"] }

[[bench]]
name    = "metrics"
harness = false

[[bench]]
name    = "core"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
