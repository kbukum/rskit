[package]
name        = "rskit-bench"
description = "ML benchmarking framework: evaluators, metrics, reports, visualization"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-bench"
readme                 = "README.md"
categories             = ["development-tools::testing"]
keywords               = ["benchmark", "evaluation", "metrics", "ml"]

[dependencies]
# External
serde          = { workspace = true }
serde_json     = { workspace = true }
futures        = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
tracing        = { workspace = true }
async-trait    = { workspace = true }
parking_lot    = { workspace = true }

# Internal
rskit-errors   = { path = "../rskit-errors" }
rskit-fs       = { path = "../rskit-fs" }
rskit-provider = { path = "../rskit-provider" }
rskit-util     = { path = "../rskit-util" }
rskit-worker   = { path = "../rskit-worker" }
rskit-cli      = { path = "../rskit-cli" }
rskit-observability = { path = "../rskit-observability" }

[dev-dependencies]
tokio     = { workspace = true, features = ["test-util", "full"] }
tempfile  = { workspace = true }
insta     = { workspace = true }
criterion = { workspace = true }
rskit     = { path = "../rskit" }

[[bench]]
name    = "metrics"
harness = false

[[bench]]
name    = "core"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
