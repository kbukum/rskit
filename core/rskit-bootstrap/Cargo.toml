[package]
name        = "rskit-bootstrap"
description = "Application lifecycle orchestration: typestate App, Component registry, hooks"
version = "0.2.0-alpha.2"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-bootstrap"
readme = "README.md"
categories = ["development-tools"]
keywords   = ["bootstrap", "lifecycle", "component"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tokio        = { workspace = true }
tokio-util   = { workspace = true }
tracing      = { workspace = true }
futures-util = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-config = { workspace = true }
rskit-component = { workspace = true }
rskit-di = { workspace = true }
rskit-hook = { workspace = true }
rskit-provider = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["full"] }
async-trait  = { workspace = true }
validator    = { workspace = true }
parking_lot  = { workspace = true }
serde        = { workspace = true }
rskit-validation = { workspace = true }
