[package]
name        = "rskit-cache"
description = "Cache abstraction with explicit store registration and local adapters"
version = "0.2.0-alpha.5"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-cache"
readme = "README.md"
categories = ["caching"]
keywords   = ["cache", "memory", "store"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
fs = ["dep:base64", "dep:rskit-util", "dep:rskit-fs", "rskit-fs/async"]

[dependencies]
# External
serde           = { workspace = true }
serde_json      = { workspace = true }
async-trait     = { workspace = true }
base64          = { workspace = true, optional = true }
tokio           = { workspace = true }
parking_lot     = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-fs = { workspace = true, optional = true }
rskit-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
