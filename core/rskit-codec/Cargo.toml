[package]
name        = "rskit-codec"
description = "Pluggable structured-text codecs (TOML/JSON/YAML) over a shared value tree, with value-tree merge"
version = "0.2.0-alpha.3"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-codec"
readme = "README.md"
categories = ["encoding", "parsing"]
keywords   = ["codec", "toml", "json", "yaml", "serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["toml"]
# Built-in TOML codec (`TomlCodec`). The JSON codec is always available because
# `serde_json::Value` is the crate's value model; the YAML codec is always
# available as well.
toml = ["dep:toml"]

[dependencies]
# External
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_norway = { workspace = true }
toml         = { workspace = true, optional = true }

# Internal
rskit-errors = { workspace = true }

[lints]
workspace = true
