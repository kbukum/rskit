[package]
name = "rskit-component"
description = "Component lifecycle primitives: Component trait, Registry, Health, and State"
readme = "README.md"
version = "0.2.0-alpha.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rskit-component"
categories = ["development-tools"]
keywords = ["component", "lifecycle", "health"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }

# Internal
rskit-errors = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
