[package]
name        = "rskit-config"
description = "Adapter-oriented configuration loading with validation"
version = "0.1.0-alpha.2"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-config"
readme = "README.md"
categories = ["config"]
keywords   = ["config", "toml", "env", "settings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["validate"]
# Opt-in `rskit_validation::Validate` integration: enables `ServiceConfig`,
# `AppConfig`, `load_validated*`, `load_app`, and `load_config`. Disable with
# `default-features = false` for apps/CLIs/libraries that load plain serde types.
validate = ["dep:validator", "dep:rskit-validation", "dep:rskit-logging"]
# Opt-in dynamic-reload contract (`ConfigWatch`) and the in-memory watch
# reference impl. One-shot tools and CLIs leave this off. The bounded fan-out
# mechanism is owned by `rskit-pipeline::Broadcaster`; `tokio-util` supplies the
# `CancellationToken` at the watch boundary.
watch = ["dep:rskit-pipeline", "dep:tokio-util"]

[dependencies]
# External
serde        = { workspace = true }
serde_json   = { workspace = true }
config       = { workspace = true }
dotenvy      = { workspace = true }
parking_lot  = { workspace = true }
validator = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing      = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-version = { workspace = true }
rskit-fs = { workspace = true }
rskit-util = { workspace = true }
rskit-codec = { workspace = true }
rskit-pipeline = { workspace = true, optional = true }
rskit-validation = { workspace = true, optional = true }
rskit-logging = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio       = { workspace = true }
futures     = { workspace = true }
validator = { workspace = true }
rskit-validation = { workspace = true }
