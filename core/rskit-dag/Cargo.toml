[package]
name        = "rskit-dag"
description = "DAG task orchestrator with parallel execution"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-dag"
readme = "README.md"
categories = ["concurrency"]
keywords   = ["dag", "orchestration", "pipeline"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde_json   = { workspace = true }
serde        = { workspace = true }
async-trait  = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
futures      = { workspace = true }
tokio-util   = { workspace = true }
parking_lot  = { workspace = true }

# Internal
rskit-errors   = { version = "0.1.0-alpha.1", path = "../rskit-errors" }
rskit-provider = { version = "0.1.0-alpha.1", path = "../rskit-provider" }
