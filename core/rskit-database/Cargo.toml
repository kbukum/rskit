[package]
name        = "rskit-database"
description = "Database contracts with feature-gated sqlx backend support"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-database"
readme = "README.md"
categories = ["database"]
keywords   = ["database", "sqlx", "repository"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
sqlx-core = ["dep:sqlx"]
sqlx-any = ["sqlx-core", "sqlx/any"]
postgres = ["sqlx-core", "sqlx/postgres"]
mysql = ["sqlx-core", "sqlx/mysql"]
sqlite = ["sqlx-core", "sqlx/sqlite"]

[dependencies]
rskit-errors    = { path = "../rskit-errors" }
rskit-bootstrap = { path = "../rskit-bootstrap" }
serde           = { workspace = true }
serde_json      = { workspace = true }
async-trait     = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
sqlx            = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "uuid", "chrono", "json"], optional = true }
chrono          = { workspace = true }
uuid            = { workspace = true }
rskit-validation = { path = "../rskit-validation" }
validator = { workspace = true }
rskit-config = { path = "../rskit-config" }
