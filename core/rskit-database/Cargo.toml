[package]
name        = "rskit-database"
description = "Database contracts with in-memory default and opt-in adapter backends"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-database"
readme = "README.md"
categories = ["database"]
keywords   = ["database", "memory", "repository"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde           = { workspace = true }
serde_json      = { workspace = true }
async-trait     = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
chrono          = { workspace = true }
uuid            = { workspace = true }
validator = { workspace = true }
parking_lot     = { workspace = true }

# Internal
rskit-errors    = { path = "../rskit-errors" }
rskit-bootstrap = { path = "../rskit-bootstrap" }
rskit-validation = { path = "../rskit-validation" }
rskit-config = { path = "../rskit-config" }
