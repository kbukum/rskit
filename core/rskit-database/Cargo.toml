[package]
name        = "rskit-database"
description = "Database contracts with in-memory default and opt-in adapter backends"
version = "0.2.0-alpha.4"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-database"
readme = "README.md"
categories = ["database"]
keywords   = ["database", "memory", "repository"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde           = { workspace = true }
serde_json      = { workspace = true }
async-trait     = { workspace = true }
tokio           = { workspace = true }
validator = { workspace = true }
parking_lot     = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-bootstrap = { workspace = true }
rskit-validation = { workspace = true }
