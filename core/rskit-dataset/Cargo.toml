[package]
name        = "rskit-dataset"
description = "Dataset collection framework: source, transform, target, collector"
version = "0.2.0-alpha.2"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-dataset"
readme                 = "README.md"
categories             = ["data-structures"]
keywords               = ["dataset", "pipeline", "collector", "etl"]

[dependencies]
# External
image = { workspace = true, optional = true }
csv = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
futures-util = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-schema = { workspace = true }
rskit-stream = { workspace = true }
rskit-util = { workspace = true }
rskit-validation = { workspace = true }

[features]
default = ["image-transform"]
image-transform = ["dep:image"]

[dev-dependencies]
parking_lot = { workspace = true }
tokio       = { workspace = true, features = ["test-util", "full"] }
tempfile    = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
