[package]
name        = "rskit-dataset"
description = "Dataset collection framework: source, transform, target, collector"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-dataset"
readme                 = "README.md"
categories             = ["data-structures"]
keywords               = ["dataset", "pipeline", "collector", "etl"]

[dependencies]
# External
image        = { version = "0.25", optional = true }
csv          = "1.3"
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
futures-util = { workspace = true }

# Internal
rskit-errors     = { version = "0.1.0-alpha.1", path = "../rskit-errors" }
rskit-fs         = { version = "0.1.0-alpha.1", path = "../rskit-fs" }
rskit-pipeline   = { version = "0.1.0-alpha.1", path = "../rskit-pipeline" }
rskit-schema     = { version = "0.1.0-alpha.1", path = "../rskit-schema" }
rskit-validation = { version = "0.1.0-alpha.1", path = "../rskit-validation" }

[features]
default = ["image-transform"]
image-transform = ["dep:image"]

[dev-dependencies]
parking_lot = { workspace = true }
tokio       = { workspace = true, features = ["test-util", "full"] }
tempfile    = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
