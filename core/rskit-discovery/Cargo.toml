[package]
name        = "rskit-discovery"
description = "Service discovery with load balancing strategies"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-discovery"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["discovery", "service-mesh", "load-balancer"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
consul = ["dep:rskit-httpclient"]
component = ["dep:rskit-bootstrap"]
server = ["component"]

[dependencies]
# External
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
async-trait  = { workspace = true }
tokio        = { workspace = true }
tokio-stream = { workspace = true }
tracing      = { workspace = true }
dashmap      = { workspace = true }
rand         = { workspace = true }
parking_lot  = { workspace = true }

# Internal
rskit-bootstrap = { path = "../rskit-bootstrap", optional = true }
rskit-errors = { path = "../rskit-errors" }
rskit-httpclient = { path = "../rskit-httpclient", optional = true }
rskit-resilience = { path = "../rskit-resilience" }
