[package]
name        = "rskit-embedding"
description = "Embedding provider abstractions for vector search"
version = "0.1.0-alpha.1"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-embedding"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["embedding", "vector", "openai", "ai"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
tracing      = { workspace = true }

# Internal
rskit-ai = { workspace = true }
rskit-component = { workspace = true }
rskit-errors = { workspace = true }
rskit-observability = { workspace = true }
rskit-provider = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
