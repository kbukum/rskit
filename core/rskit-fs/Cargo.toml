[package]
name        = "rskit-fs"
description = "Local filesystem primitives for paths, files, directories, temp files, and atomic writes"
version = "0.1.0-alpha.3"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-fs"
readme = "README.md"
categories = ["filesystem"]
keywords   = ["filesystem", "paths", "files", "directories"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["async"]
async = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, features = ["fs", "io-util"], optional = true }
tempfile = { workspace = true }

rskit-errors = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
