[package]
name = "rskit-git"
version.workspace = true
edition.workspace = true
description = "Composable git repository interfaces backed by libgit2"
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rskit-git"
readme = "README.md"
categories = ["development-tools"]
keywords = ["git", "repository", "diff", "version-control"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
testutil = ["dep:tempfile"]

[dependencies]
# External
git2 = { version = "0.21", default-features = false, features = ["https", "ssh"] }
thiserror = { workspace = true }
tempfile = { workspace = true, optional = true }

# Internal
rskit-errors = { version = "0.1.0", path = "../rskit-errors" }
rskit-fs = { version = "0.1.0", path = "../rskit-fs", default-features = false }
rskit-process = { version = "0.1.0", path = "../rskit-process" }

[dev-dependencies]
rskit-testutil = { version = "0.1.0", path = "../rskit-testutil" }
tempfile = { workspace = true }
