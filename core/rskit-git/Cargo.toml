[package]
name = "rskit-git"
version.workspace = true
edition.workspace = true
description = "Composable git repository interfaces backed by libgit2"
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
testutil = ["dep:tempfile"]

[dependencies]
# External
git2 = { version = "0.21", default-features = false, features = ["https", "ssh"] }
thiserror = { workspace = true }
tempfile = { workspace = true, optional = true }

# Internal
rskit-errors = { path = "../rskit-errors" }
rskit-fs = { path = "../rskit-fs" }
rskit-process = { path = "../rskit-process" }

[dev-dependencies]
tempfile = { workspace = true }
