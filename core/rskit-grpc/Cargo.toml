[package]
name        = "rskit-grpc"
description = "tonic gRPC client transport for rskit"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-grpc"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["grpc", "tonic", "client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tonic          = { workspace = true }
tokio          = { workspace = true, features = ["test-util"] }
tower          = { workspace = true }
tracing        = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
http           = { workspace = true }
chrono         = { workspace = true }

# Internal
rskit-errors   = { path = "../rskit-errors" }
rskit-fs       = { path = "../rskit-fs" }
rskit-resilience = { path = "../rskit-resilience" }
rskit-security = { path = "../rskit-security" }
rskit-discovery = { path = "../rskit-discovery", optional = true }

[dev-dependencies]
tokio-util     = { workspace = true }
parking_lot    = { workspace = true }

[features]
default    = ["client"]
client     = []
discovery  = ["client", "dep:rskit-discovery"]
