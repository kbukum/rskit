[package]
name        = "rskit-grpc"
description = "tonic gRPC transport and status mapping for rskit"
version = "0.2.0-alpha.4"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-grpc"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["grpc", "tonic", "client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tonic          = { workspace = true }
tokio          = { workspace = true, features = ["test-util"] }
tracing        = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
http           = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-fs = { workspace = true, features = ["async"] }
rskit-resilience = { workspace = true }
rskit-security = { workspace = true }
rskit-discovery = { workspace = true, optional = true }

[dev-dependencies]
tokio-util     = { workspace = true }
parking_lot    = { workspace = true }

[features]
default    = ["client"]
client     = []
discovery  = ["client", "dep:rskit-discovery"]
