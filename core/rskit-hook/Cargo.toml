[package]
name        = "rskit-hook"
description = "Generic event hook system — register handlers and emit events with zero domain dependencies"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-hook"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["hook", "event", "agent", "middleware"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio        = { workspace = true }
parking_lot  = { workspace = true }
tracing      = { workspace = true }
tokio-util   = { workspace = true }
rskit-errors = { workspace = true }
