[package]
name        = "rskit-http"
description = "Framework-neutral HTTP abstractions and Tower adapters for rskit transport"
version = "0.1.0-alpha.1"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-http"
readme = "README.md"
categories = ["web-programming"]
keywords   = ["http", "transport", "headers"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde           = { workspace = true }
tokio           = { workspace = true }
tower            = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "request-id", "timeout"] }
http = { workspace = true }
serde_json      = { workspace = true }
uuid            = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-security = { workspace = true }

[dev-dependencies]
axum      = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "router"
harness = false
