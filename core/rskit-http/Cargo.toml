[package]
name        = "rskit-http"
description = "Axum transport details for rskit server integrations"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-http"
readme = "README.md"
categories = ["web-programming::http-server"]
keywords   = ["axum", "http", "server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-errors    = { path = "../rskit-errors" }
rskit-bootstrap = { path = "../rskit-bootstrap" }
rskit-logging   = { path = "../rskit-logging" }
serde           = { workspace = true }
async-trait     = { workspace = true }
tokio           = { workspace = true }
tokio-util      = { workspace = true }
tracing         = { workspace = true }
axum            = { version = "0.8", features = ["http2"] }
tower            = { workspace = true }
tower-http      = { version = "0.6", features = ["cors", "trace", "request-id", "timeout"] }
hyper            = { version = "1", features = ["full"] }
hyper-util      = { version = "0.1", features = ["tokio"] }
http             = "1"
validator        = { workspace = true }
serde_json      = { workspace = true }
uuid            = { workspace = true }
parking_lot     = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "router"
harness = false
