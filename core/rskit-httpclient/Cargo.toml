[package]
name        = "rskit-httpclient"
description = "Async HTTP client with auth and injected resilience policies for rskit"
version = "0.1.0-alpha.2"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-httpclient"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["http-client", "async", "auth", "resilience"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
reqwest      = { workspace = true }
tokio        = { workspace = true, features = ["sync"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
tracing      = { workspace = true }
bytes        = { workspace = true }
http         = { workspace = true }
base64       = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-fs = { workspace = true }
rskit-resilience = { workspace = true }
rskit-security = { workspace = true }

[dev-dependencies]
futures      = { workspace = true }
tokio        = { workspace = true }
wiremock = { workspace = true }
tempfile     = { workspace = true }
insta        = { workspace = true }
rand         = { workspace = true }

[features]
default = []
danger-tls = []
