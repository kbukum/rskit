[package]
name        = "rskit-inference"
description = "Model-serving runtime inference abstractions and registry"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-inference"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["inference", "serving", "triton", "vllm", "ai"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
bytes        = { workspace = true, features = ["serde"] }
thiserror    = { workspace = true }
tokio-stream = { workspace = true }
uuid         = { version = "1", features = ["v7"] }

# Internal
rskit-ai = { workspace = true }
rskit-component = { version = "0.1.0", path = "../rskit-component" }
rskit-errors = { version = "0.1.0", path = "../rskit-errors" }
rskit-provider = { version = "0.1.0", path = "../rskit-provider" }
rskit-tool   = { version = "0.1.0", path = "../rskit-tool" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
