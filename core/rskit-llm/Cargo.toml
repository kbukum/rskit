[package]
name        = "rskit-llm"
description = "LLM provider abstractions for OpenAI and Anthropic"
version = "0.1.0-alpha.1"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-llm"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["llm", "openai", "anthropic", "ai"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
parking_lot  = { workspace = true }

# Internal
rskit-ai = { workspace = true }
rskit-component = { workspace = true }
rskit-errors = { workspace = true }
rskit-provider = { workspace = true }
rskit-tool = { workspace = true }

[dev-dependencies]
# External
tokio               = { workspace = true }
