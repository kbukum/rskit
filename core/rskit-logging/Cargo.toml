[package]
name        = "rskit-logging"
description = "Structured logging setup using tracing — JSON in production, pretty in dev"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-logging"
readme = "README.md"
categories = ["development-tools"]
keywords   = ["logging", "tracing", "observability"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
]

[dependencies]
# External
parking_lot        = { workspace = true }
regex              = { workspace = true }
serde              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
# Optional OTLP dependencies (enabled via `otlp` feature)
opentelemetry                  = { workspace = true, optional = true }
opentelemetry_sdk              = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp             = { workspace = true, optional = true }

# Internal
rskit-errors       = { version = "0.1.0", path = "../rskit-errors" }
rskit-config       = { version = "0.1.0", path = "../rskit-config" }

[dev-dependencies]
serde_json = { workspace = true }
tempfile   = { workspace = true }
