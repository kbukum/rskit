[package]
name        = "rskit-logging"
description = "Structured logging setup using tracing — JSON in production, pretty in dev"
version = "0.2.0-alpha.1"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-logging"
readme = "README.md"
categories = ["development-tools"]
keywords   = ["logging", "tracing", "observability"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["setup"]
# Subscriber-building layer: `init_logging*`, `LoggingGuard`, masking, sampling,
# per-module levels, and context helpers. Pulls in the `tracing` subscriber
# stack. Disable with `default-features = false` to depend on only the
# tracing-free configuration vocabulary (`LoggingConfig`/`LogFormat`/`LogOutput`).
setup = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:regex",
    "dep:parking_lot",
]
otlp = [
    "setup",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
]

[dependencies]
# External
serde              = { workspace = true }
# Subscriber-stack dependencies (enabled via the default-on `setup` feature)
parking_lot        = { workspace = true, optional = true }
regex              = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Optional OTLP dependencies (enabled via `otlp` feature)
opentelemetry                  = { workspace = true, optional = true }
opentelemetry_sdk              = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp             = { workspace = true, optional = true }

# Internal
rskit-errors = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
serde_json = { workspace = true }
tempfile   = { workspace = true }
