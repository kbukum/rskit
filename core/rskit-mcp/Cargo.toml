[package]
name        = "rskit-mcp"
description = "Bridge between rskit tool registry and Model Context Protocol (MCP)"
version = "0.2.0-alpha.4"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-mcp"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["mcp", "tool", "agent", "context-protocol"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
protocol = ["dep:rmcp", "rmcp/transport-async-rw"]
server  = ["protocol", "rmcp/server", "rmcp/transport-io", "rmcp/transport-streamable-http-server"]
client  = ["protocol", "rmcp/client", "rmcp/transport-child-process"]

[dependencies]
# External
rmcp = { workspace = true, optional = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
parking_lot  = { workspace = true }
url = { workspace = true }

# Internal
rskit-ai = { workspace = true }
rskit-component = { workspace = true }
rskit-observability = { workspace = true }
rskit-tool = { workspace = true, features = ["validation"] }
rskit-schema = { workspace = true, features = ["validation"] }
rskit-errors = { workspace = true }
rskit-authz = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
schemars = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
