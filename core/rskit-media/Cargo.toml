[package]
name        = "rskit-media"
description = "Media types, codec/format registry, pipeline builder, and processing traits"
version = "0.1.0-alpha.2"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-media"
readme                 = "README.md"
categories             = ["multimedia", "asynchronous"]
keywords               = ["media", "video", "audio", "pipeline"]

[dependencies]
# External
serde        = { workspace = true, features = ["rc"] }
serde_json   = { workspace = true }
chrono       = { workspace = true }
async-trait  = { workspace = true }
tokio-util   = { workspace = true, features = ["rt"] }

# Internal
rskit-errors = { workspace = true }
rskit-storage = { workspace = true }

[dev-dependencies]
# External
tokio      = { workspace = true, features = ["test-util"] }
insta = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
