[package]
name        = "rskit-resilience"
description = "Fault-tolerance: retry, circuit breaker, bulkhead, rate limiter + tower layers"
version = "0.1.0-alpha.2"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-resilience"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["retry", "circuit-breaker", "rate-limiter", "resilience"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tokio         = { workspace = true }
tokio-util    = { workspace = true }
governor      = { workspace = true }
rand          = { workspace = true }
parking_lot   = { workspace = true }
tracing       = { workspace = true }
tower         = { workspace = true }

# Internal
rskit-errors = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
