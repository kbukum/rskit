[package]
name        = "rskit-resilience"
description = "Fault-tolerance: retry, circuit breaker, bulkhead, rate limiter + tower layers"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-resilience"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["retry", "circuit-breaker", "rate-limiter", "resilience"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tokio         = { workspace = true }
tokio-util    = { workspace = true }
governor      = { workspace = true }
rand          = { workspace = true }
parking_lot   = { workspace = true }
tracing       = { workspace = true }
tower         = { workspace = true }
tower-layer   = { workspace = true }
tower-service = { workspace = true }
futures-util  = { workspace = true }
pin-project-lite = { workspace = true }
serde         = { workspace = true, features = ["derive"] }

# Internal
rskit-errors  = { version = "0.1.0", path = "../rskit-errors" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
