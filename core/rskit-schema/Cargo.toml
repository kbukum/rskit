[package]
name        = "rskit-schema"
description = "JSON Schema generation from Rust types via schemars"
version = "0.2.0-alpha.3"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-schema"
readme = "README.md"
categories = ["encoding"]
keywords   = ["json-schema", "schemars", "schema", "validation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Runtime JSON Schema validation (`compile`, `validate`, `CompiledSchema`, …).
# Default-on because validating untrusted tool inputs and structured model
# output is a security control for the tool/mcp/agent stack. Disable with
# `default-features = false` to keep only tracing-free schema *generation*
# (schemars) and drop the `jsonschema` runtime validator and its dependency tree.
default = ["validation"]
validation = ["dep:jsonschema"]

[dependencies]
# External dependencies
schemars   = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true, optional = true }

# Internal dependencies
rskit-errors = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
