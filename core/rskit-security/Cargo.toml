[package]
name        = "rskit-security"
description = "Shared TLS and security configuration for rskit transports"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-security"
readme                 = "README.md"
categories             = ["network-programming", "config"]
keywords               = ["security", "tls", "mtls", "certificate"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
http         = { workspace = true }
serde        = { workspace = true }

# Internal
rskit-errors = { path = "../rskit-errors" }
rskit-util   = { path = "../rskit-util" }
subtle       = "2.6"
