[package]
name        = "rskit-security"
description = "Security headers and transport security policy for rskit services"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-security"
readme                 = "README.md"
categories             = ["web-programming", "network-programming"]
keywords               = ["security", "headers", "csp", "hsts"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
http         = { workspace = true }
serde        = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }

# Internal
rskit-errors = { path = "../rskit-errors" }
rskit-validation = { path = "../rskit-validation" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
