[package]
name        = "rskit-server"
description = "Service-facing server abstractions and lifecycle-managed transports for rskit"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-server"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["grpc", "tonic", "server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tonic            = { workspace = true }
tonic-health     = { workspace = true }
tonic-reflection = { workspace = true }
tokio            = { workspace = true }
tokio-util       = { workspace = true }
tower            = { workspace = true }
tower-layer      = { workspace = true }
tower-service    = { workspace = true }
tracing          = { workspace = true }
async-trait      = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
validator = { workspace = true }
parking_lot      = { workspace = true }
http             = { workspace = true }
base64           = { workspace = true }
axum             = { workspace = true }
tower-http       = { workspace = true }

# Internal
rskit-errors     = { path = "../rskit-errors" }
rskit-config     = { path = "../rskit-config" }
rskit-bootstrap  = { path = "../rskit-bootstrap" }
rskit-resilience = { path = "../rskit-resilience" }
rskit-security   = { path = "../rskit-security" }
rskit-validation = { path = "../rskit-validation" }
rskit-version    = { path = "../rskit-version" }

[dev-dependencies]
futures          = { workspace = true }
