[package]
name        = "rskit-skill"
description = "SDK-free skill manifests, loaders, registries, and verification contracts"
version = "0.1.0-alpha.1"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-skill"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["skill", "agent", "manifest"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
parking_lot  = { workspace = true }
serde        = { workspace = true }
serde_norway = { workspace = true }
sha2         = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
rskit-config = { workspace = true }
rskit-errors = { workspace = true }
rskit-fs = { workspace = true }
rskit-validation = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
