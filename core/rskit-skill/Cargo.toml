[package]
name        = "rskit-skill"
description = "SDK-free skill manifests, loaders, registries, and verification contracts"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-skill"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["skill", "agent", "manifest"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
parking_lot  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_norway = { workspace = true }
sha2         = { workspace = true }
thiserror    = { workspace = true }
rskit-config = { path = "../rskit-config" }
rskit-errors = { path = "../rskit-errors" }
rskit-validation = { path = "../rskit-validation" }
