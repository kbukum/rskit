[package]
name        = "rskit-testutil"
description = "Test utilities, mock providers, and assertion helpers"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-testutil"
readme = "README.md"
categories = ["development-tools::testing"]
keywords   = ["testing", "mock", "testutil"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
async-trait    = { workspace = true }
tokio          = { workspace = true }
parking_lot    = { workspace = true }
uuid           = { workspace = true }
serde          = { workspace = true }
validator      = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-fs = { workspace = true }
rskit-provider = { workspace = true }
rskit-component = { workspace = true }
rskit-hook = { workspace = true }
rskit-config = { workspace = true }
rskit-validation = { workspace = true }
