[package]
name        = "rskit-testutil"
description = "Test utilities, mock providers, and assertion helpers"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-testutil"
readme = "README.md"
categories = ["development-tools::testing"]
keywords   = ["testing", "mock", "testutil"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
async-trait    = { workspace = true }
tokio          = { workspace = true }
parking_lot    = { workspace = true }
uuid           = { workspace = true }
serde          = { workspace = true }
validator      = { workspace = true }

# Internal
rskit-errors   = { version = "0.1.0", path = "../rskit-errors" }
rskit-fs       = { version = "0.1.0", path = "../rskit-fs", default-features = false }
rskit-provider = { version = "0.1.0", path = "../rskit-provider" }
rskit-component = { version = "0.1.0", path = "../rskit-component" }
rskit-hook     = { version = "0.1.0", path = "../rskit-hook" }
rskit-config   = { version = "0.1.0", path = "../rskit-config" }
rskit-validation = { version = "0.1.0", path = "../rskit-validation" }
