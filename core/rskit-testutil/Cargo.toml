[package]
name        = "rskit-testutil"
description = "Test utilities, mock providers, and assertion helpers"
version = "0.2.0-alpha.5"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-testutil"
readme = "README.md"
categories = ["development-tools::testing"]
keywords   = ["testing", "mock", "testutil"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
async-trait    = { workspace = true }
tokio          = { workspace = true }
parking_lot    = { workspace = true }
uuid           = { workspace = true }
serde          = { workspace = true }
validator      = { workspace = true }
regex          = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-fs = { workspace = true }
rskit-util = { workspace = true }
rskit-provider = { workspace = true }
rskit-component = { workspace = true }
rskit-hook = { workspace = true }
rskit-config = { workspace = true }
rskit-validation = { workspace = true }
rskit-ai = { workspace = true, optional = true }
rskit-embedding = { workspace = true, optional = true }

[features]
# Scriptable embedding provider fake ([`FakeEmbeddingProvider`]); off by default so consumers that only need core fakes do not compile the embedding stack.
embedding = ["dep:rskit-ai", "dep:rskit-embedding"]
