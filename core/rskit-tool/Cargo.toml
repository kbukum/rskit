[package]
name        = "rskit-tool"
description = "Tool definition, auto-wiring, registry and middleware for agentic systems"
version = "0.2.0-alpha.3"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-tool"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["tool", "agent", "mcp", "function-calling"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Runtime input validation via `rskit-schema` (`from_fn`/`from_fn_simple`
# auto-compile a JSON Schema validator for tool inputs). Default-on because
# validating untrusted tool inputs is a security control. Disable with
# `default-features = false` for consumers that only build tool *definitions*
# (e.g. inference/LLM transports) and never auto-wire validating tools — this
# drops the `jsonschema` runtime validator and its dependency tree.
default = ["validation"]
validation = ["rskit-schema/validation"]

[dependencies]
# External
serde          = { workspace = true }
serde_json     = { workspace = true }
async-trait    = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true, features = ["rt"] }
parking_lot    = { workspace = true }
tracing        = { workspace = true }
schemars       = { workspace = true }

# Internal
rskit-ai = { workspace = true }
rskit-component = { workspace = true }
rskit-observability = { workspace = true }
rskit-schema = { workspace = true }
rskit-errors = { workspace = true }

[lints]
workspace = true
