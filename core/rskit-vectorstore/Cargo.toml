[package]
name        = "rskit-vectorstore"
description = "Vector store abstraction with in-memory default and opt-in adapter backends"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-vectorstore"
readme = "README.md"
categories = ["database"]
keywords   = ["vector", "memory", "similarity", "search"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
serde         = { workspace = true }
serde_json    = { workspace = true }
async-trait   = { workspace = true }
tracing       = { workspace = true }
parking_lot   = { workspace = true }

# Internal
rskit-errors  = { version = "0.1.0", path = "../rskit-errors" }

[dev-dependencies]
tokio = { workspace = true }
