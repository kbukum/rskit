[package]
name        = "rskit-vectorstore"
description = "Vector store abstraction with in-memory default and opt-in Qdrant backend"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-vectorstore"
categories = ["database"]
keywords   = ["vector", "qdrant", "similarity", "search"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
qdrant = ["dep:qdrant-client"]

[dependencies]
# External
serde         = { workspace = true }
serde_json    = { workspace = true }
async-trait   = { workspace = true }
tracing       = { workspace = true }
parking_lot   = { workspace = true }
qdrant-client = { version = ">=1.13, <1.18", optional = true }

# Internal
rskit-errors  = { path = "../rskit-errors" }

[dev-dependencies]
tokio = { workspace = true }
