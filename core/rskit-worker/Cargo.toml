[package]
name        = "rskit-worker"
description = "Task worker pool with JoinSet, typed events, and provider bridges"
version = "0.2.0-alpha.4"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-worker"
readme = "README.md"
categories = ["concurrency", "asynchronous"]
keywords   = ["worker", "pool", "task", "async"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# External
tokio            = { workspace = true }
tokio-util       = { workspace = true }
futures          = { workspace = true }
tracing          = { workspace = true }
uuid             = { workspace = true }
chrono           = { workspace = true }
async-trait      = { workspace = true }
parking_lot      = { workspace = true }
serde            = { workspace = true }

# Internal
rskit-errors = { workspace = true }
rskit-provider = { workspace = true }
