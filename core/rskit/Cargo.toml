[package]
name        = "rskit-suite"
description = "Production Rust toolkit facade — modular entry point for rskit-* crates"
version = "0.2.0-alpha.7"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-suite"
readme = "README.md"
categories = ["development-tools", "network-programming", "asynchronous"]
keywords   = ["toolkit", "async", "resilience", "grpc"]

[lib]
name = "rskit"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Release-train umbrella: this facade re-exports the workspace, so the release
# tooling force-bumps it whenever any other crate in its workspace is bumped,
# keeping its version the single headline marker for the whole release.
[package.metadata.release]
umbrella = true

[dependencies]
# Always-on core crates
rskit-util = { workspace = true }
rskit-errors = { workspace = true }
rskit-fs = { workspace = true }
rskit-config = { workspace = true }
rskit-logging = { workspace = true, features = ["setup"] }
rskit-bootstrap = { workspace = true }
rskit-component = { workspace = true }
rskit-provider = { workspace = true }
rskit-stream = { workspace = true }
rskit-resilience = { workspace = true }
rskit-worker = { workspace = true }
rskit-validation = { workspace = true }
validator = { workspace = true }
rskit-chain = { workspace = true, optional = true }
rskit-process = { workspace = true, optional = true }
rskit-stateful = { workspace = true, optional = true }
rskit-version = { workspace = true, optional = true }
rskit-schema = { workspace = true, optional = true, features = ["validation"] }
rskit-hook = { workspace = true, optional = true }

# Feature-gated crates
rskit-server = { workspace = true, optional = true }
rskit-grpc = { workspace = true, optional = true }
rskit-encryption = { workspace = true, optional = true }
rskit-http = { workspace = true, optional = true }
rskit-httpclient = { workspace = true, optional = true }
rskit-auth = { workspace = true, optional = true }
rskit-di = { workspace = true, optional = true }
rskit-database = { workspace = true, optional = true }
rskit-database-sqlite = { workspace = true, optional = true }
rskit-cache = { workspace = true, optional = true }
rskit-cache-redis = { workspace = true, optional = true }
rskit-messaging = { workspace = true, optional = true }
rskit-messaging-kafka = { workspace = true, optional = true }
rskit-messaging-nats = { workspace = true, optional = true }
rskit-messaging-rabbitmq = { workspace = true, optional = true }
rskit-observability = { workspace = true, optional = true }
rskit-authz = { workspace = true, optional = true }
rskit-security = { workspace = true, optional = true }
rskit-discovery = { workspace = true, optional = true }
rskit-sse = { workspace = true, optional = true }
rskit-dag = { workspace = true, optional = true }
rskit-ai = { workspace = true, optional = true }
rskit-llm = { workspace = true, optional = true }
rskit-llm-openai = { workspace = true, optional = true }
rskit-llm-anthropic = { workspace = true, optional = true }
rskit-llm-ollama = { workspace = true, optional = true }
rskit-llm-gemini = { workspace = true, optional = true }
rskit-embedding = { workspace = true, optional = true }
rskit-inference = { workspace = true, optional = true }
rskit-inference-triton = { workspace = true, optional = true }
rskit-inference-vllm = { workspace = true, optional = true }
rskit-inference-tgi = { workspace = true, optional = true }
rskit-skill = { workspace = true, optional = true }
rskit-tool = { workspace = true, optional = true, features = ["validation"] }
rskit-agent = { workspace = true, optional = true }
rskit-mcp = { workspace = true, optional = true }
rskit-storage = { workspace = true, optional = true }
rskit-storage-s3 = { workspace = true, optional = true }
rskit-storage-gcs = { workspace = true, optional = true }
rskit-storage-supabase = { workspace = true, optional = true }
rskit-media = { workspace = true, optional = true }
rskit-media-ffmpeg = { workspace = true, optional = true }
rskit-media-image = { workspace = true, optional = true }
rskit-media-audio = { workspace = true, optional = true }
rskit-cli = { workspace = true, optional = true }
rskit-git = { workspace = true, optional = true }
rskit-dataset = { workspace = true, optional = true }
rskit-bench = { workspace = true, optional = true }
rskit-workload = { workspace = true, optional = true }
rskit-vectorstore = { workspace = true, optional = true }
rskit-vectorstore-qdrant = { workspace = true, optional = true }

[dev-dependencies]
tokio       = { workspace = true, features = ["full"] }
tokio-util  = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
http        = { workspace = true }
parking_lot = { workspace = true }
serde       = { workspace = true }

[features]
default       = []
config-watch  = ["rskit-config/watch"]
fs-watch      = ["rskit-fs/watch"]
server        = ["dep:rskit-server"]
grpc          = ["dep:rskit-grpc"]
encryption    = ["dep:rskit-encryption"]
http          = ["dep:rskit-http"]
httpclient    = ["dep:rskit-httpclient"]
auth          = ["dep:rskit-auth"]
auth-jwt      = ["auth", "rskit-auth/jwt"]
auth-oidc     = ["auth", "rskit-auth/oidc"]
di            = ["dep:rskit-di"]
database      = ["dep:rskit-database"]
database-sqlite = ["database", "dep:rskit-database-sqlite"]
cache         = ["dep:rskit-cache"]
cache-fs      = ["cache", "rskit-cache/fs"]
cache-redis   = ["cache", "dep:rskit-cache-redis"]
messaging     = ["dep:rskit-messaging"]
messaging-kafka = ["messaging", "dep:rskit-messaging-kafka"]
messaging-nats = ["messaging", "dep:rskit-messaging-nats"]
messaging-rabbitmq = ["messaging", "dep:rskit-messaging-rabbitmq"]
observability = ["dep:rskit-observability"]
authz         = ["dep:rskit-authz"]
security      = ["dep:rskit-security"]
discovery     = ["dep:rskit-discovery"]
sse           = ["dep:rskit-sse"]
dag           = ["dep:rskit-dag"]
genai        = ["dep:rskit-ai"]
llm           = ["genai", "dep:rskit-llm"]
llm-openai    = ["llm", "dep:rskit-llm-openai"]
llm-anthropic = ["llm", "dep:rskit-llm-anthropic"]
llm-ollama    = ["llm", "dep:rskit-llm-ollama"]
llm-gemini    = ["llm", "dep:rskit-llm-gemini"]
embedding     = ["genai", "dep:rskit-embedding"]
inference     = ["dep:rskit-inference"]
inference-triton = ["inference", "dep:rskit-inference-triton"]
inference-vllm = ["inference", "dep:rskit-inference-vllm"]
inference-tgi = ["inference", "dep:rskit-inference-tgi"]
prompt        = ["dep:rskit-ai"]
skill         = ["dep:rskit-skill"]
tool          = ["dep:rskit-tool"]
agent         = ["dep:rskit-agent"]
mcp           = ["dep:rskit-mcp"]
storage       = ["dep:rskit-storage"]
media         = ["dep:rskit-media", "storage"]
media-ffmpeg  = ["dep:rskit-media-ffmpeg", "media"]
media-image   = ["dep:rskit-media-image", "media"]
media-audio   = ["dep:rskit-media-audio", "media"]
media-full    = ["media-ffmpeg", "media-image", "media-audio"]
storage-s3    = ["storage", "dep:rskit-storage-s3"]
storage-gcs   = ["storage", "dep:rskit-storage-gcs"]
storage-supabase = ["storage", "dep:rskit-storage-supabase"]
cli           = ["dep:rskit-cli"]
cli-interactive = ["cli", "rskit-cli/interactive"]
git           = ["dep:rskit-git"]
dataset       = ["dep:rskit-dataset"]
dataset-image = ["dataset", "rskit-dataset/image-transform"]
bench         = ["dep:rskit-bench"]
workload      = ["dep:rskit-workload"]
vectorstore   = ["dep:rskit-vectorstore"]
vectorstore-qdrant = ["vectorstore", "dep:rskit-vectorstore-qdrant"]
chain         = ["dep:rskit-chain"]
process       = ["dep:rskit-process"]
stateful      = ["dep:rskit-stateful"]
version       = ["dep:rskit-version"]
schema        = ["dep:rskit-schema"]
hook          = ["dep:rskit-hook"]
full          = [
    "server", "grpc", "encryption", "http", "httpclient", "auth", "di", "database", "database-sqlite", "cache", "messaging",
    "cache-fs", "cache-redis", "messaging-kafka", "messaging-nats", "messaging-rabbitmq",
    "observability", "authz", "security", "discovery", "sse", "dag", "genai", "llm",
    "llm-openai", "llm-anthropic", "llm-ollama", "llm-gemini", "embedding",
    "inference", "inference-triton", "inference-vllm", "inference-tgi",
    "prompt", "skill", "tool", "agent", "mcp", "media-full", "storage", "storage-s3", "storage-gcs", "storage-supabase",
    "cli", "git", "dataset", "dataset-image", "bench", "vectorstore", "vectorstore-qdrant", "chain", "process", "stateful",
    "version", "schema", "hook", "workload",
]
