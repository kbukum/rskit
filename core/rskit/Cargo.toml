[package]
name        = "rskit"
description = "Production Rust toolkit — modular facade for rskit-* crates"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit"
readme = "README.md"
categories = ["development-tools", "network-programming", "asynchronous"]
keywords   = ["toolkit", "async", "resilience", "grpc"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Always-on core crates
rskit-util       = { version = "0.1.0-alpha.1", path = "../rskit-util" }
rskit-errors     = { version = "0.1.0-alpha.1", path = "../rskit-errors" }
rskit-fs         = { version = "0.1.0-alpha.1", path = "../rskit-fs" }
rskit-config     = { version = "0.1.0-alpha.1", path = "../rskit-config" }
rskit-logging    = { version = "0.1.0-alpha.1", path = "../rskit-logging" }
rskit-bootstrap  = { version = "0.1.0-alpha.1", path = "../rskit-bootstrap" }
rskit-component  = { version = "0.1.0-alpha.1", path = "../rskit-component" }
rskit-provider   = { version = "0.1.0-alpha.1", path = "../rskit-provider" }
rskit-pipeline   = { version = "0.1.0-alpha.1", path = "../rskit-pipeline" }
rskit-resilience = { version = "0.1.0-alpha.1", path = "../rskit-resilience" }
rskit-worker     = { version = "0.1.0-alpha.1", path = "../rskit-worker" }
rskit-validation = { version = "0.1.0-alpha.1", path = "../rskit-validation" }
validator = { workspace = true }
rskit-chain      = { version = "0.1.0-alpha.1", path = "../rskit-chain", optional = true }
rskit-process    = { version = "0.1.0-alpha.1", path = "../rskit-process", optional = true }
rskit-stateful   = { version = "0.1.0-alpha.1", path = "../rskit-stateful", optional = true }
rskit-version    = { version = "0.1.0-alpha.1", path = "../rskit-version", optional = true }
rskit-schema     = { version = "0.1.0-alpha.1", path = "../rskit-schema", optional = true }
rskit-hook       = { version = "0.1.0-alpha.1", path = "../rskit-hook", optional = true }

# Feature-gated crates
rskit-server        = { version = "0.1.0-alpha.1", path = "../rskit-server",        optional = true }
rskit-grpc          = { version = "0.1.0-alpha.1", path = "../rskit-grpc",          optional = true }
rskit-encryption    = { version = "0.1.0-alpha.1", path = "../rskit-encryption",    optional = true }
rskit-http          = { version = "0.1.0-alpha.1", path = "../rskit-http",          optional = true }
rskit-httpclient    = { version = "0.1.0-alpha.1", path = "../rskit-httpclient",    optional = true }
rskit-auth          = { version = "0.1.0-alpha.1", path = "../rskit-auth",          optional = true }
rskit-di            = { version = "0.1.0-alpha.1", path = "../rskit-di",            optional = true }
rskit-database      = { version = "0.1.0-alpha.1", path = "../rskit-database",      optional = true }
rskit-cache         = { version = "0.1.0-alpha.1", path = "../rskit-cache",         optional = true }
rskit-cache-redis   = { version = "0.1.0-alpha.1", path = "../../contrib/cache/redis", optional = true }
rskit-messaging     = { version = "0.1.0-alpha.1", path = "../rskit-messaging",     optional = true }
rskit-messaging-kafka = { version = "0.1.0-alpha.1", path = "../../contrib/messaging/kafka", optional = true }
rskit-messaging-nats = { version = "0.1.0-alpha.1", path = "../../contrib/messaging/nats", optional = true }
rskit-messaging-rabbitmq = { version = "0.1.0-alpha.1", path = "../../contrib/messaging/rabbitmq", optional = true }
rskit-observability = { version = "0.1.0-alpha.1", path = "../rskit-observability", optional = true }
rskit-authz         = { version = "0.1.0-alpha.1", path = "../rskit-authz",         optional = true }
rskit-security      = { version = "0.1.0-alpha.1", path = "../rskit-security",      optional = true }
rskit-discovery     = { version = "0.1.0-alpha.1", path = "../rskit-discovery",     optional = true }
rskit-sse           = { version = "0.1.0-alpha.1", path = "../rskit-sse",           optional = true }
rskit-dag           = { version = "0.1.0-alpha.1", path = "../rskit-dag",           optional = true }
rskit-ai        = { version = "0.1.0-alpha.1", path = "../rskit-ai",        optional = true }
rskit-llm           = { version = "0.1.0-alpha.1", path = "../rskit-llm",           optional = true }
rskit-llm-openai    = { version = "0.1.0-alpha.1", path = "../../contrib/llm/openai", optional = true }
rskit-llm-anthropic = { version = "0.1.0-alpha.1", path = "../../contrib/llm/anthropic", optional = true }
rskit-llm-ollama    = { version = "0.1.0-alpha.1", path = "../../contrib/llm/ollama", optional = true }
rskit-llm-gemini    = { version = "0.1.0-alpha.1", path = "../../contrib/llm/gemini", optional = true }
rskit-embedding     = { version = "0.1.0-alpha.1", path = "../rskit-embedding",     optional = true }
rskit-inference     = { version = "0.1.0-alpha.1", path = "../rskit-inference",     optional = true }
rskit-inference-triton = { version = "0.1.0-alpha.1", path = "../../contrib/inference/triton", optional = true }
rskit-inference-vllm = { version = "0.1.0-alpha.1", path = "../../contrib/inference/vllm", optional = true }
rskit-inference-tgi = { version = "0.1.0-alpha.1", path = "../../contrib/inference/tgi", optional = true }
rskit-skill         = { version = "0.1.0-alpha.1", path = "../rskit-skill",         optional = true }
rskit-tool          = { version = "0.1.0-alpha.1", path = "../rskit-tool",          optional = true }
rskit-agent         = { version = "0.1.0-alpha.1", path = "../rskit-agent",         optional = true }
rskit-mcp           = { version = "0.1.0-alpha.1", path = "../rskit-mcp",           optional = true }
rskit-storage       = { version = "0.1.0-alpha.1", path = "../rskit-storage", optional = true }
rskit-storage-s3    = { version = "0.1.0-alpha.1", path = "../../contrib/storage/s3", optional = true }
rskit-storage-gcs   = { version = "0.1.0-alpha.1", path = "../../contrib/storage/gcs", optional = true }
rskit-media         = { version = "0.1.0-alpha.1", path = "../rskit-media",         optional = true }
rskit-media-ffmpeg  = { version = "0.1.0-alpha.1", path = "../../contrib/media/ffmpeg",  optional = true }
rskit-media-image   = { version = "0.1.0-alpha.1", path = "../../contrib/media/image",   optional = true }
rskit-media-audio   = { version = "0.1.0-alpha.1", path = "../../contrib/media/audio",   optional = true }
rskit-cli           = { version = "0.1.0-alpha.1", path = "../rskit-cli",           optional = true }
rskit-git           = { version = "0.1.0-alpha.1", path = "../rskit-git",           optional = true }
rskit-dataset       = { version = "0.1.0-alpha.1", path = "../rskit-dataset",       optional = true }
rskit-bench         = { version = "0.1.0-alpha.1", path = "../rskit-bench",         optional = true }
rskit-vectorstore   = { version = "0.1.0-alpha.1", path = "../rskit-vectorstore",   optional = true }
rskit-vectorstore-qdrant = { version = "0.1.0-alpha.1", path = "../../contrib/vectorstore/qdrant", optional = true }

[dev-dependencies]
tokio       = { workspace = true, features = ["full"] }
tokio-util  = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
http        = { workspace = true }
parking_lot = { workspace = true }
serde       = { workspace = true }

[features]
default       = []
server        = ["dep:rskit-server"]
grpc          = ["dep:rskit-grpc"]
encryption    = ["dep:rskit-encryption"]
http          = ["dep:rskit-http"]
httpclient    = ["dep:rskit-httpclient"]
auth          = ["dep:rskit-auth"]
di            = ["dep:rskit-di"]
database      = ["dep:rskit-database"]
cache         = ["dep:rskit-cache"]
cache-fs      = ["cache", "rskit-cache/fs"]
cache-redis   = ["cache", "dep:rskit-cache-redis"]
messaging     = ["dep:rskit-messaging"]
messaging-kafka = ["messaging", "dep:rskit-messaging-kafka"]
messaging-nats = ["messaging", "dep:rskit-messaging-nats"]
messaging-rabbitmq = ["messaging", "dep:rskit-messaging-rabbitmq"]
observability = ["dep:rskit-observability"]
authz         = ["dep:rskit-authz"]
security      = ["dep:rskit-security"]
discovery     = ["dep:rskit-discovery"]
sse           = ["dep:rskit-sse"]
dag           = ["dep:rskit-dag"]
genai        = ["dep:rskit-ai"]
llm           = ["genai", "dep:rskit-llm"]
llm-openai    = ["llm", "dep:rskit-llm-openai"]
llm-anthropic = ["llm", "dep:rskit-llm-anthropic"]
llm-ollama    = ["llm", "dep:rskit-llm-ollama"]
llm-gemini    = ["llm", "dep:rskit-llm-gemini"]
embedding     = ["genai", "dep:rskit-embedding"]
inference     = ["dep:rskit-inference"]
inference-triton = ["inference", "dep:rskit-inference-triton"]
inference-vllm = ["inference", "dep:rskit-inference-vllm"]
inference-tgi = ["inference", "dep:rskit-inference-tgi"]
prompt        = ["dep:rskit-ai"]
skill         = ["dep:rskit-skill"]
tool          = ["dep:rskit-tool"]
agent         = ["dep:rskit-agent"]
mcp           = ["dep:rskit-mcp"]
storage       = ["dep:rskit-storage"]
media         = ["dep:rskit-media", "storage"]
media-ffmpeg  = ["dep:rskit-media-ffmpeg", "media"]
media-image   = ["dep:rskit-media-image", "media"]
media-audio   = ["dep:rskit-media-audio", "media"]
media-full    = ["media-ffmpeg", "media-image", "media-audio"]
storage-s3    = ["storage", "dep:rskit-storage-s3"]
storage-gcs   = ["storage", "dep:rskit-storage-gcs"]
cli           = ["dep:rskit-cli"]
git           = ["dep:rskit-git"]
dataset       = ["dep:rskit-dataset"]
bench         = ["dep:rskit-bench"]
vectorstore   = ["dep:rskit-vectorstore"]
vectorstore-qdrant = ["vectorstore", "dep:rskit-vectorstore-qdrant"]
chain         = ["dep:rskit-chain"]
process       = ["dep:rskit-process"]
stateful      = ["dep:rskit-stateful"]
version       = ["dep:rskit-version"]
schema        = ["dep:rskit-schema"]
hook          = ["dep:rskit-hook"]
full          = [
    "server", "grpc", "encryption", "http", "httpclient", "auth", "di", "database", "cache", "messaging",
    "cache-fs", "cache-redis", "messaging-kafka", "messaging-nats", "messaging-rabbitmq",
    "observability", "authz", "security", "discovery", "sse", "dag", "genai", "llm",
    "llm-openai", "llm-anthropic", "llm-ollama", "llm-gemini", "embedding",
    "inference", "inference-triton", "inference-vllm", "inference-tgi",
    "prompt", "skill", "tool", "agent", "mcp", "media-full", "storage", "storage-s3", "storage-gcs",
    "cli", "git", "dataset", "bench", "vectorstore", "vectorstore-qdrant", "chain", "process", "stateful",
    "version", "schema", "hook",
]
