[package]
name        = "rskit-bootstrap"
description = "Application lifecycle orchestration: typestate App, Component registry, hooks"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-bootstrap"
readme = "README.md"
categories = ["development-tools"]
keywords   = ["bootstrap", "lifecycle", "component"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-errors = { path = "../rskit-errors" }
rskit-config = { path = "../rskit-config" }
rskit-logging = { path = "../rskit-logging" }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
futures-util = { workspace = true }
futures      = { workspace = true }
validator    = { workspace = true }
parking_lot  = { workspace = true }

[dev-dependencies]
serde        = { workspace = true }
tokio        = { workspace = true, features = ["full"] }
