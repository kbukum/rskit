[package]
name        = "rskit-cache"
description = "Cache abstraction with in-memory default and opt-in Redis backend"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-cache"
readme = "README.md"
categories = ["caching"]
keywords   = ["cache", "memory", "redis", "store"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
redis = ["dep:redis"]

[dependencies]
rskit-errors    = { path = "../rskit-errors" }
rskit-bootstrap = { path = "../rskit-bootstrap" }
serde           = { workspace = true }
serde_json      = { workspace = true }
async-trait     = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
parking_lot     = { workspace = true }
redis           = { workspace = true, optional = true }
