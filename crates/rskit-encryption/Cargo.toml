[package]
name        = "rskit-encryption"
description = "Encryption utilities: AES-256-GCM and ChaCha20-Poly1305"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-encryption"
readme = "README.md"
categories = ["cryptography"]
keywords   = ["encryption", "aes", "chacha20", "security"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-errors = { path = "../rskit-errors" }
aes-gcm      = "0.10"
chacha20poly1305 = "0.10"
sha2         = "0.11"
pbkdf2       = "0.13"
rand         = { workspace = true }
base64       = { workspace = true }
zeroize      = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
