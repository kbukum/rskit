[package]
name        = "rskit-grpc-client"
description = "tonic gRPC client with discovery and config — mirrors gokit/grpc/client and pykit-grpc"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-grpc-client"
readme = "README.md"
categories = ["network-programming"]
keywords   = ["grpc", "tonic", "client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-errors   = { path = "../rskit-errors" }
rskit-discovery = { path = "../rskit-discovery", optional = true }
tonic          = { workspace = true }
tokio          = { workspace = true }
tower          = { workspace = true }
tracing        = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
http           = { workspace = true }
chrono         = { workspace = true }

[dev-dependencies]
tokio-util     = { workspace = true }

[features]
default    = []
discovery  = ["rskit-discovery"]
