[package]
name        = "rskit-inference-tgi"
description = "Hugging Face TGI REST adapter skeleton for rskit-inference"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-inference-tgi"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["inference", "tgi", "ai"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-ai = { workspace = true }
rskit-component = { path = "../rskit-component" }
rskit-errors    = { path = "../rskit-errors" }
rskit-inference = { path = "../rskit-inference" }
rskit-tool      = { path = "../rskit-tool" }
async-trait     = { workspace = true }
reqwest         = { workspace = true, features = ["json"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
tokio-stream    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
