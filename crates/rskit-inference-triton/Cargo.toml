[package]
name        = "rskit-inference-triton"
description = "Triton KServe v2 HTTP adapter for rskit-inference"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-inference-triton"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["inference", "triton", "kserve", "ai"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-ai = { workspace = true }
rskit-authz       = { path = "../rskit-authz" }
rskit-component   = { path = "../rskit-component" }
rskit-errors      = { path = "../rskit-errors" }
rskit-inference   = { path = "../rskit-inference" }
rskit-observability = { path = "../rskit-observability" }
rskit-resilience  = { path = "../rskit-resilience" }
rskit-tool        = { path = "../rskit-tool" }
async-trait       = { workspace = true }
base64            = { workspace = true }
bytes             = { workspace = true }
reqwest           = { workspace = true, features = ["json"] }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true }
tracing           = { workspace = true }
uuid              = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
