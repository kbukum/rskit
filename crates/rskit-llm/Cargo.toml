[package]
name        = "rskit-llm"
description = "LLM provider abstractions for OpenAI and Anthropic"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit-llm"
readme = "README.md"
categories = ["api-bindings"]
keywords   = ["llm", "openai", "anthropic", "ai"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-errors = { path = "../rskit-errors" }
rskit-tool   = { path = "../rskit-tool" }
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }

[dev-dependencies]
rskit-openai     = { path = "../rskit-openai" }
rskit-anthropic  = { path = "../rskit-anthropic" }
tokio            = { workspace = true }
serde_json       = { workspace = true }
