[package]
name        = "rskit-messaging-rabbitmq"
description = "RabbitMQ adapter for rskit-messaging"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-messaging-rabbitmq"
readme                 = "README.md"
categories             = ["asynchronous"]
keywords               = ["rabbitmq", "amqp", "messaging", "consumer"]

[lints]
workspace = true

[dependencies]
rskit-errors    = { path = "../rskit-errors" }
rskit-messaging = { path = "../rskit-messaging" }
async-trait     = { workspace = true }
futures-util    = { workspace = true }
lapin           = { workspace = true }
parking_lot     = { workspace = true }
serde           = { workspace = true }
tokio           = { workspace = true }
tokio-util      = { workspace = true }
tracing         = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
