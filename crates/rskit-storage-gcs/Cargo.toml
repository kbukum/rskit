[package]
name        = "rskit-storage-gcs"
description = "Google Cloud Storage backend for rskit-storage"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/rskit-storage-gcs"
readme                 = "README.md"
categories             = ["filesystem", "asynchronous", "web-programming"]
keywords               = ["gcs", "google-cloud", "storage", "async", "file"]

[dependencies]
rskit-errors  = { path = "../rskit-errors" }
rskit-storage = { path = "../rskit-storage" }
google-cloud-storage = "=0.22.1"
async-trait   = { workspace = true }
bytes         = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }
