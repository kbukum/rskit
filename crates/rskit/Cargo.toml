[package]
name        = "rskit"
description = "Production Rust toolkit — modular facade for rskit-* crates"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit"
readme = "README.md"
categories = ["development-tools", "network-programming", "asynchronous"]
keywords   = ["toolkit", "async", "resilience", "grpc"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rskit-errors     = { path = "../rskit-errors" }
rskit-config     = { path = "../rskit-config" }
rskit-logging    = { path = "../rskit-logging" }
rskit-bootstrap  = { path = "../rskit-bootstrap" }
rskit-provider   = { path = "../rskit-provider" }
rskit-pipeline   = { path = "../rskit-pipeline" }
rskit-resilience = { path = "../rskit-resilience" }
rskit-worker     = { path = "../rskit-worker" }
rskit-server     = { path = "../rskit-server", optional = true }

[dev-dependencies]
tokio       = { workspace = true, features = ["full"] }
tokio-util  = { workspace = true }
async-trait = { workspace = true }

[features]
default = []
server  = ["dep:rskit-server"]
full    = ["server"]
