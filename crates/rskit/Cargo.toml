[package]
name        = "rskit"
description = "Production Rust toolkit — modular facade for rskit-* crates"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/rskit"
readme = "README.md"
categories = ["development-tools", "network-programming", "asynchronous"]
keywords   = ["toolkit", "async", "resilience", "grpc"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
futures          = { workspace = true }
dashmap          = { workspace = true }
# Always-on core crates
rskit-errors     = { version = "0.1.0", path = "../rskit-errors" }
rskit-config     = { version = "0.1.0", path = "../rskit-config" }
rskit-logging    = { version = "0.1.0", path = "../rskit-logging" }
rskit-bootstrap  = { version = "0.1.0", path = "../rskit-bootstrap" }
rskit-provider   = { version = "0.1.0", path = "../rskit-provider" }
rskit-pipeline   = { version = "0.1.0", path = "../rskit-pipeline" }
rskit-resilience = { version = "0.1.0", path = "../rskit-resilience" }
rskit-worker     = { version = "0.1.0", path = "../rskit-worker" }
rskit-validation = { version = "0.1.0", path = "../rskit-validation" }

# Feature-gated crates
rskit-server        = { version = "0.1.0", path = "../rskit-server",        optional = true }
rskit-grpc-client   = { version = "0.1.0", path = "../rskit-grpc-client",   optional = true }
rskit-encryption    = { version = "0.1.0", path = "../rskit-encryption",    optional = true }
rskit-http          = { version = "0.1.0", path = "../rskit-http",          optional = true }
rskit-httpclient    = { version = "0.1.0", path = "../rskit-httpclient",    optional = true }
rskit-auth          = { version = "0.1.0", path = "../rskit-auth",          optional = true }
rskit-di            = { version = "0.1.0", path = "../rskit-di",            optional = true }
rskit-database      = { version = "0.1.0", path = "../rskit-database",      optional = true }
rskit-cache         = { version = "0.1.0", path = "../rskit-cache",         optional = true }
rskit-messaging     = { version = "0.1.0", path = "../rskit-messaging",     optional = true }
rskit-observability = { version = "0.1.0", path = "../rskit-observability",  optional = true }
rskit-authz         = { version = "0.1.0", path = "../rskit-authz",         optional = true }
rskit-discovery     = { version = "0.1.0", path = "../rskit-discovery",     optional = true }
rskit-testutil      = { version = "0.1.0", path = "../rskit-testutil",      optional = true }
rskit-sse           = { version = "0.1.0", path = "../rskit-sse",           optional = true }
rskit-dag           = { version = "0.1.0", path = "../rskit-dag",           optional = true }
rskit-llm           = { version = "0.1.0", path = "../rskit-llm",           optional = true }
rskit-file          = { version = "0.1.0", path = "../rskit-file",          optional = true }
rskit-file-s3       = { version = "0.1.0", path = "../rskit-file-s3",       optional = true }
rskit-media         = { version = "0.1.0", path = "../rskit-media",         optional = true }
rskit-media-ffmpeg  = { version = "0.1.0", path = "../rskit-media-ffmpeg",  optional = true }
rskit-media-image   = { version = "0.1.0", path = "../rskit-media-image",   optional = true }
rskit-cli           = { version = "0.1.0", path = "../rskit-cli",           optional = true }
rskit-dataset       = { version = "0.1.0", path = "../rskit-dataset",       optional = true }
rskit-bench         = { version = "0.1.0", path = "../rskit-bench",         optional = true }

[dev-dependencies]
tokio       = { workspace = true, features = ["full"] }
tokio-util  = { workspace = true }
async-trait = { workspace = true }

[features]
default       = []
server        = ["dep:rskit-server"]
grpc-client   = ["dep:rskit-grpc-client"]
encryption    = ["dep:rskit-encryption"]
http          = ["dep:rskit-http"]
httpclient    = ["dep:rskit-httpclient"]
auth          = ["dep:rskit-auth"]
di            = ["dep:rskit-di"]
database      = ["dep:rskit-database"]
cache         = ["dep:rskit-cache"]
messaging     = ["dep:rskit-messaging"]
observability = ["dep:rskit-observability"]
authz         = ["dep:rskit-authz"]
discovery     = ["dep:rskit-discovery"]
testutil      = ["dep:rskit-testutil"]
sse           = ["dep:rskit-sse"]
dag           = ["dep:rskit-dag"]
llm           = ["dep:rskit-llm"]
file          = ["dep:rskit-file"]
media         = ["dep:rskit-media", "file"]
media-ffmpeg  = ["dep:rskit-media-ffmpeg", "media"]
media-image   = ["dep:rskit-media-image", "media"]
media-full    = ["media-ffmpeg", "media-image"]
file-s3       = ["file", "dep:rskit-file-s3"]
file-gcs      = ["file", "rskit-file/gcs"]
cli           = ["dep:rskit-cli"]
dataset       = ["dep:rskit-dataset", "cli"]
bench         = ["dep:rskit-bench"]
full          = [
    "server", "grpc-client", "encryption", "http", "httpclient", "auth", "di", "database", "cache", "messaging",
    "observability", "authz", "discovery", "testutil", "sse", "dag", "llm",
    "media-full", "file", "cli", "dataset", "bench",
]
