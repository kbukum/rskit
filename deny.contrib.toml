# cargo-deny configuration for contrib workspace.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# We publish under MIT; only allow permissive licenses in dependencies.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# Allow confidence threshold for license detection
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Deny duplicate dependency versions by default.
multiple-versions = "deny"
# Deny crates with known security advisories.
deny = []
skip = [
    # Contrib adapters intentionally cover several external service stacks.
    # These exceptions are limited to upstream stable-version splits that cannot
    # be aligned without dropping adapters, downgrading direct deps, or using RC
    # crypto crates.
    { name = "block-buffer", reason = "RustCrypto 0.10/0.11 ecosystem split; no all-stable alignment yet" },
    { name = "const-oid", reason = "PKI/ASN.1 and RustCrypto stacks depend on different stable const-oid lines" },
    { name = "cpufeatures", reason = "RustCrypto 0.10/0.11 ecosystem split; no all-stable alignment yet" },
    { name = "crypto-common", reason = "RustCrypto 0.10/0.11 ecosystem split; no all-stable alignment yet" },
    { name = "digest", reason = "RustCrypto 0.10/0.11 ecosystem split; no all-stable alignment yet" },
    { name = "getrandom", reason = "adapter TLS/crypto stacks, NATS rand 0.8, shared rand 0.9, and Google/RabbitMQ rand 0.10 paths use different maintained getrandom lines" },
    { name = "hashbrown", reason = "dashmap/governor, jsonschema/referencing, and indexmap depend on different stable hashbrown lines" },
    { name = "hmac", reason = "PKCS/PBKDF2 transitive deps and cloud SDK signing use different stable hmac lines" },
    { name = "http", reason = "AWS SDK still carries http 0.2 while hyper/reqwest/tonic use http 1.x" },
    { name = "http-body", reason = "AWS SDK still carries http-body 0.4 while hyper/reqwest/tonic use http-body 1.x" },
    { name = "nom", reason = "AMQP protocol and ASN.1 parser stacks depend on different stable nom lines" },
    { name = "num-bigint", reason = "redis 1.6 uses num-bigint 0.5 while AWS protocol-test and x509-parser stacks still use num-bigint 0.4" },
    { name = "rand", reason = "async-nats/nkeys use rand 0.8, shared resilience/telemetry paths use rand 0.9, and Google/RabbitMQ transitive paths use rand 0.10" },
    { name = "rand_chacha", reason = "async-nats/nkeys use rand_chacha 0.3 through rand 0.8 while shared rand 0.9 paths use rand_chacha 0.9" },
    { name = "rand_core", reason = "adapter crypto stacks, rand 0.8/0.9 consumers, and Google/RabbitMQ rand 0.10 paths use different rand_core lines" },
    { name = "sha1", reason = "AWS/AMQP/PKI transitive stacks and current crypto crates use different stable sha1 lines" },
    { name = "sha2", reason = "AWS/AMQP/PKI transitive stacks and direct workspace code use different stable sha2 lines" },
    { name = "syn", reason = "proc-macro crates are mid-migration from syn 2 to syn 3; async-trait and other derives pull syn 3 while the wider ecosystem still uses syn 2" },
    { name = "spin", reason = "ring and PKI parser stacks depend on different stable spin lines" },
    { name = "base64", reason = "tokenizers' spm_precompiled dep still uses base64 0.13 while the shared stack uses base64 0.22" },
    { name = "darling", reason = "tokenizers' derive_builder uses darling 0.20 while other adapter derives use darling 0.23" },
    { name = "darling_core", reason = "tokenizers' derive_builder uses darling_core 0.20 while other adapter derives use darling_core 0.23" },
    { name = "darling_macro", reason = "tokenizers' derive_builder uses darling_macro 0.20 while other adapter derives use darling_macro 0.23" },
]

# L7 dependency direction: rskit-ai is the only shared AI/ML vocabulary crate.
# cargo-deny bans cannot express parent->child workspace path edges without banning
# legitimate consumers globally, so CI runs scripts/rskit_tool.py check l7-edges after cargo-deny
# to fail on disallowed direct normal-dependency regressions.

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
# Fetch the RustSec advisory database.
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
# Deny all unmaintained crates (upgrade or replace them).
ignore = [
    # `paste` is archived/unmaintained but still pulled transitively by
    # `tokenizers` (HuggingFace) via its proc-macro deps. It is a compile-time
    # macro with no runtime/network surface and no safe upgrade exists yet; the
    # HuggingFace adapter is opt-in and off by default.
    "RUSTSEC-2024-0436",
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
