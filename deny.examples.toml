# cargo-deny configuration for examples workspace.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# We publish under MIT; only allow permissive licenses in dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
]
# Allow confidence threshold for license detection
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Deny duplicate dependency versions by default.
multiple-versions = "deny"
# Deny crates with known security advisories.
deny = []
skip = [
    # Examples exercise the facade and inherit stable upstream version splits
    # from runtime/toolkit stacks. Keep exceptions narrow so example graphs do
    # not silently accumulate adapter-only duplicate families.
    { name = "getrandom", reason = "governor/rand 0.9 and tempfile/uuid currently use different maintained getrandom lines" },
    { name = "hashbrown", reason = "dashmap/governor, indexmap, and tower depend on different stable hashbrown lines" },
]

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
# Fetch the RustSec advisory database.
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
# Deny all unmaintained crates (upgrade or replace them).
ignore = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
