# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# We publish under MIT; only allow permissive licenses in dependencies.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]
# Allow confidence threshold for license detection
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Deny duplicate dependency versions by default.
multiple-versions = "deny"
# Deny crates with known security advisories.
deny = []
skip = [
    # Workspace crypto deps are on the digest 0.11 family; axum/tungstenite
    # (sha1), sqlx (sha2) and p12-keystore still pull the 0.10 family.
    { name = "block-buffer", reason = "workspace uses the digest 0.11 family while axum/tungstenite/sqlx/p12-keystore still use 0.10" },
    { name = "cpufeatures", reason = "workspace uses the digest 0.11 family while axum/tungstenite/sqlx/p12-keystore still use 0.10" },
    { name = "crypto-common", reason = "workspace uses the digest 0.11 family while axum/tungstenite/sqlx/p12-keystore still use 0.10" },
    { name = "digest", reason = "workspace uses the digest 0.11 family while axum/tungstenite/sqlx/p12-keystore still use 0.10" },
    { name = "base64", reason = "axum/tonic/sqlx/jsonwebtoken use base64 0.22 while reqwest/hyper-util/rmcp/google-cloud use 0.23" },
    { name = "getrandom", reason = "stable crypto/TLS/build-helper crates, rand 0.9 consumers, and tempfile/uuid currently use different maintained getrandom lines" },
    { name = "hashbrown", reason = "dashmap/governor, jsonschema/referencing, and indexmap depend on different stable hashbrown lines" },
    { name = "openssl-probe", reason = "git2 and rustls-native-certs depend on different openssl-probe lines" },
    { name = "rand_core", reason = "current stable crypto crates use rand_core 0.6 while rand 0.9 consumers use rand_core 0.9" },
    { name = "syn", reason = "proc-macro crates are mid-migration from syn 2 to syn 3; async-trait and other derives pull syn 3 while the wider ecosystem still uses syn 2" },
]

# L7 dependency direction: rskit-ai is the only shared AI/ML vocabulary crate.
# cargo-deny bans cannot express parent->child workspace path edges without banning
# legitimate consumers globally, so CI runs scripts/rskit_tool.py check l7-edges after cargo-deny
# to fail on disallowed direct normal-dependency regressions.

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
# Fetch the RustSec advisory database.
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
# Deny all unmaintained crates (upgrade or replace them).
ignore = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
