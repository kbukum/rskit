[workspace]
resolver = "2"
members = [
    "agent-demo",
    "core-cli",
    "media-demo",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.91"
authors = ["kbukum contributors"]
repository = "https://github.com/kbukum/rskit"
publish = false

[workspace.dependencies]
# Internal
rskit = { package = "rskit-suite", path = "../core/rskit", version = "0.2.0-alpha.1" }

# External
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
indicatif = "0.18"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
unreachable_pub = "warn"
# `missing_docs` is intentionally omitted here (unlike core/contrib): examples are
# non-published demos (`publish = false`) whose `pub` items exist to support
# integration tests, not as a documented API surface.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
# Conflicts with the explicitly enabled `unreachable_pub`: crate-internal items in
# private modules are kept `pub(crate)` to document intent, not widened to `pub`.
redundant_pub_crate = "allow"
