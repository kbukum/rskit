[workspace]
resolver = "2"
members = [
    "agent-demo",
    "media-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"
authors = ["kbukum contributors"]
repository = "https://github.com/kbukum/rskit"
publish = false

[workspace.dependencies]
# Core crates
rskit = { path = "../core/rskit", version = "0.1.0" }

# External
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
indicatif = "0.18"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
