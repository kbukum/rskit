[package]
name        = "agent-demo"
version     = "0.1.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish     = false

[dependencies]
rskit-errors      = { path = "../../crates/rskit-errors" }
rskit-bootstrap   = { path = "../../crates/rskit-bootstrap" }
rskit-worker      = { path = "../../crates/rskit-worker" }
rskit-cli         = { path = "../../crates/rskit-cli" }
rskit-pipeline    = { path = "../../crates/rskit-pipeline" }
rskit-storage        = { path = "../../crates/rskit-storage" }
rskit-media       = { path = "../../crates/rskit-media" }
rskit-media-image = { path = "../../crates/rskit-media-image" }

tokio       = { workspace = true, features = ["full"] }
tokio-util  = { workspace = true }
indicatif   = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
uuid        = { version = "1", features = ["v4"] }
chrono      = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
