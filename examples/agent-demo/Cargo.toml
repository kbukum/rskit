[package]
name        = "agent-demo"
version     = "0.1.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish     = false

[dependencies]
rskit-errors      = { workspace = true }
rskit-bootstrap   = { workspace = true }
rskit-worker      = { workspace = true }
rskit-cli         = { workspace = true }
rskit-pipeline    = { workspace = true }
rskit-storage     = { workspace = true }
rskit-media       = { workspace = true }
rskit-media-image = { workspace = true }

tokio       = { workspace = true, features = ["full"] }
tokio-util  = { workspace = true }
indicatif   = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
uuid        = { version = "1", features = ["v4"] }
chrono      = { workspace = true }
