id: declare-only-aggregator
language: rust
severity: error
message: >-
  aggregator (lib.rs/mod.rs) must declare and re-export only — no functions,
  types, consts, statics, impls, traits, macros, bare `use` imports, or inline
  modules. Move logic into concern-named sibling files and re-export with
  `pub use` (development principles §4).
files:
  # Depth convention: core crates live at core/<crate>/src, contrib adapters at
  # contrib/<domain>/<crate>/src. A crate added at a different depth would fall
  # outside these globs and go unchecked — extend them if the layout changes.
  - core/*/src/lib.rs
  - core/*/src/**/mod.rs
  - contrib/*/*/src/lib.rs
  - contrib/*/*/src/**/mod.rs
rule:
  any:
    - kind: function_item
    - kind: impl_item
    - kind: struct_item
    - kind: enum_item
    - kind: union_item
    - kind: trait_item
    - kind: const_item
    - kind: static_item
    - kind: type_item
    - kind: macro_definition
    # item-level macro invocation (e.g. `include_proto!`); ignore macros used
    # inside an attribute such as `#![doc = include_str!("../README.md")]`
    - all:
        - kind: macro_invocation
        - not: { inside: { kind: attribute, stopBy: end } }
    - kind: foreign_mod_item
    # bare `use` import (no `pub`): a private import implies consuming logic
    - all:
        - kind: use_declaration
        - not: { has: { kind: visibility_modifier, stopBy: neighbor } }
    # inline module with a body (`mod x { ... }`) instead of `mod x;`
    - all:
        - kind: mod_item
        - has: { kind: declaration_list, stopBy: neighbor }
