[project]
name = "rskit"
root = "."
base_ref = "origin/main"
# Repo-wide inputs: a change to any of these re-selects every module in
# changed-scope runs (`toven affected`, `toven coverage --merge-base`).
global_inputs = [
  ".cargo/*",
  ".config/*",
  ".github/workflows/*",
  "Makefile",
  "clippy.toml",
  "deny*.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "scripts/*",
  "toven.toml",
]

# Smart defaults fill in tasks, run strategy, and toolchain probes.
# Uncomment to override, e.g.:
#   run_strategy = "leaf-to-top"
[ecosystems.rust]
manifests = "auto"
# The `fuzz/` workspace (`rskit-fuzz`) is a `cargo fuzz` harness: its only
# targets are `[[bin]]` fuzz entrypoints with `test = false`, so it has no
# unit-test or coverage surface of its own (the logic it fuzzes lives in the
# covered core crates). Running any test/coverage task over it is a no-op that
# errors (`cargo llvm-cov` fails with "no profraw files"). rskit builds, tests,
# covers, formats, and deny-checks only core/contrib/examples (the Makefile
# scopes those explicitly; lockfile upkeep uses plain `cargo`), so the harness
# has no place in Toven discovery. Dropping it here keeps the combined
# `toven coverage` honest and green across the three real workspaces and removes
# the need to defensively release-exclude it below.
exclude = ["fuzz"]

[ecosystems.rust.coverage]
# Canonical coverage gate (the sole entrypoint is `toven coverage`; the former
# `scripts/rskit_tool.py coverage` path and `.config/coverage.toml` are retired).
# Line-only gate, matching the historical policy: 90% per module, 95% for the
# security-load-bearing set, with a small set of justified per-module floors and
# `rskit-suite` (the facade smoke aggregator) measured but never gated.
changed_line = 70.0
enforcement = "block"
exclude = ["rskit-suite"]
line = 90.0

[ecosystems.rust.coverage.profiles.security]
# Security-load-bearing crates hold a higher line floor.
line = 95.0
modules = [
  "rskit-auth",
  "rskit-authz",
  "rskit-encryption",
  "rskit-errors",
  "rskit-resilience",
  "rskit-security",
]

# rskit-process is gated below the default because its llvm-cov *line* metric is
# unreliable for this crate, while region and function coverage confirm the
# reachable logic is well covered:
#   * Multi-line call/closure argument lines report 0 hits even though the
#     enclosing statement provably executes (e.g. the readiness/spawn error
#     constructors run but their bare-identifier argument lines count 0).
#   * The line count is not stable across edits: removing a few dead source
#     lines can shift the reported line denominator and percentage in
#     counter-intuitive ways.
# The only remaining genuinely-uncovered logic is defensive I/O-error handling
# (child.wait/try_wait/kill/write returning unexpected errors) that cannot be
# driven deterministically without fault injection. The floor still gates real
# regressions (coverage is a signal, not a target).
[modules."rust:rskit-process".coverage]
line = 85.0

# rskit-testutil is the shipped test-tooling crate; some helper surface is only
# exercised by downstream crates, so it carries a lower own-crate floor.
[modules."rust:rskit-testutil".coverage]
line = 80.0

# rskit-messaging-rabbitmq is gated below the default because its remaining
# uncovered logic is live-broker lapin code (connect, create_channel, basic_qos,
# queue_declare, consumer task delivery) that cannot run without a real RabbitMQ
# broker, which the no-network unit-test policy forbids. All broker-independent
# logic (config validation, routing, lazy factory wiring, receive timeout, event
# decode) is covered.
[modules."rust:rskit-messaging-rabbitmq".coverage]
line = 85.0

# rskit's publishable core and contrib crates publish to crates.io; a release is
# gated on a clean tree and registry idempotency, supports an alpha prerelease
# channel, and publishes a hosted GitHub Release whose `release.published` event
# triggers the crates.io publication.
[ecosystems.rust.release]
readiness = ["clean-tree", "registry-idempotent"]
registry = "crates-io"
# rskit ships as one release train under a single umbrella tag: change-gating
# anchors each crate on `max(crates.io published version, the crate's own
# version at the umbrella tag commit)` (`registry+umbrella`), and the release
# scopes to the single umbrella `vX.Y.Z` tag (`tag_mode = "umbrella"`), never a
# tag per crate. Under `entrypoint = "maintainer"` (below) the maintainer cuts
# that umbrella tag by hand and `release tag` only verifies it — it is never
# created by Toven. Both are the Rust adapter's defaults for a train with one
# umbrella module except `tag_mode`, whose adapter default is `both`; they are
# stated explicitly here so the layout is legible from the config alone.
baseline = "registry+umbrella"
tag_mode = "umbrella"
# The umbrella tag is annotated and GPG-signed with the maintainer's configured
# git signing key. Under `entrypoint = "maintainer"` (below) Toven never creates,
# moves, or signature-verifies a tag — the maintainer cuts and signs the umbrella
# tag by hand (and checks it with `git verify-tag`) — so these keys are
# documentary here, recording the signing policy the maintainer applies; `release
# tag` / `release publish` only confirm the tag exists and points at HEAD
# (existence and reachability, not its signature) rather than creating it.
sign_tags = true
tag_message = "release {module} {version}"
# `main` is protected and rejects direct pushes, so the version/changelog bump
# commit must land through a reviewed pull request — never a direct push. Setting
# `push_branch = false` keeps `release tag`/`release publish` from ever pushing a
# branch ref: the maintainer runs `make release-bump` (`toven release bump`) while
# on `main` to write and stage the manifest bumps (bump is stage-only and never
# commits, so protected `main` is untouched; see the `branch_channels` note below
# for why the bump runs on `main`), then cuts a `release/vX.Y.Z` branch carrying
# the staged change to open a PR, and only after that PR merges into `main` does
# the maintainer cut the signed umbrella tag on the merged commit. Defaults to
# `true`; keep it `false` while `main` is protected.
push_branch = false
# The release entrypoint is the maintainer: after the bump PR merges into `main`,
# the maintainer creates the single umbrella `vX.Y.Z` tag (see rust:rskit-suite
# below) by hand on the merged commit. Toven's tag and publish phases then
# *verify* that umbrella tag exists at HEAD — Toven never creates or moves a
# maintainer-owned tag. Publishing the hosted GitHub Release on that tag then
# triggers `release publish`, which publishes each crate to crates.io against it.
# See docs/RELEASING.md.
entrypoint = "maintainer"

[ecosystems.rust.release.host]
forge = "github"

# rskit is in its pre-stable alpha line, so releases stay on the `alpha` prerelease channel by default rather than finalizing to a stable version.
# The default is declared here, not passed as a flag: `channels` is the allowed set, and `branch_channels` maps a branch name to the channel that `toven release bump/tag/publish` cuts from with no `--pre` argument.
# The channel is resolved from the *current* git branch by **exact** name (no globs), and `toven release bump` accepts no `--pre` override (it is tag/publish-only). Because `release/vX.Y.Z` branch names are version-specific they cannot be enumerated here, so `make release-bump` must run on `main` (mapped below); the maintainer then cuts the release branch carrying the staged bump. Running the bump on a `release/*` branch finds no mapping and finalizes the alpha train to a stable version.
# rskit runs the bump from `main`, so `main` maps to `alpha`; the alpha line advances (…-alpha.N → …-alpha.N+1) automatically.
# To graduate to a stable `X.Y.Z`, intentionally override with an explicit stable cut (e.g. `--set-version`) or remove the mapping — the config never silently finalizes the prerelease.
[ecosystems.rust.release.prerelease]
channels = ["alpha"]
branch_channels = { main = "alpha" }

# rskit-suite is the release train's umbrella: the facade crate whose version is
# the workspace release version. Its hosted GitHub Release (tagged `vX.Y.Z`) is
# the single umbrella Release the maintainer publishes to start CI, and the
# umbrella `vX.Y.Z` tag is the only tag the train creates (`tag_mode =
# "umbrella"` above). Every other crate publishes to crates.io with its own
# independent version but cuts no separate tag or Release, aggregating its notes
# onto this one. The `v{version}` tag matches the historical `rskit_tool`
# umbrella tag scheme.
[modules."rust:rskit-suite".release]
umbrella = true
tag_format = "v{version}"
# rskit's README install snippets pin crate versions in shapes Toven's native,
# line-anchored `version_references` sync cannot rewrite — table-attribute pins
# (`crate = { version = "x", features = [..] }`) and column-aligned whitespace.
# The umbrella cascades on every release, so its bump `on_resolved` hook is the
# one place the whole-tree README pin sync runs. Toven resolves every crate's
# post-bump version, materializes the authoritative `key -> version` map to a
# generated file outside the repo, and hands its path to this task argv-first
# (spliced at `{args}`); the task rewrites the pins and the edits join the same
# staged set as the manifests. A hook failure aborts the bump atomically.
on_resolved = ["sync-readme-versions"]

# The `examples/` demos (`agent-demo`, `core-cli`, `media-demo`) are
# `publish = false` in their manifests and must never reach crates.io. Toven
# does not infer publishability from a manifest's `publish = false`, so each
# non-publishable crate is classified explicitly here as excluded from the
# release (no version bump, tag, registry call, or hosted release). This keeps
# workspace discovery from sweeping the demos into the registry train. (The
# `fuzz/` harness needs no such block: it is dropped from discovery entirely via
# `[ecosystems.rust].exclude` above.)
[modules."rust:agent-demo".release]
exclude = true

[modules."rust:core-cli".release]
exclude = true

[modules."rust:media-demo".release]
exclude = true

[ecosystems.rust.tasks.build]
argv = ["cargo", "build", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.check]
argv = ["cargo", "check", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.coverage]
# `--all-features` matches the retired runner's coverage scope (and the sbom
# task surface): without it the feature-gated modules across the workspace are
# neither compiled nor instrumented, so the gate could pass green while shipped
# feature surfaces carry no coverage. Contrib adapters declare no cargo features,
# so this only widens instrumentation to the feature-gated core crates and the
# facade's feature re-exports.
argv = ["cargo", "llvm-cov", "--manifest-path", "{module.manifest}", "--workspace", "--all-features", "--lcov", "--output-path", "target/toven/coverage/rust-{module.name}.lcov", "{args}"]
cacheable = false
fan_out = "whole-workspace"
# `cargo llvm-cov --workspace` measures each workspace atomically and resolves
# its own cross-workspace closure, so it is sound to co-schedule inside the
# facade back-dependency cycle (core's `rskit` facade depends on contrib for its
# feature re-exports, while contrib depends back on core). Without this the
# combined `toven coverage` fails closed on that cycle; with it a single
# invocation gates core+contrib+examples in one wave. Matches the Rust adapter
# default for this task.
workspace_closure = true
kind = "coverage"
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.doc]
# rustdoc flags are pinned in the environment: Cargo lets RUSTDOCFLAGS and
# CARGO_ENCODED_RUSTDOCFLAGS override config, which would drop `-D warnings`.
argv = ["env", "-u", "CARGO_ENCODED_RUSTDOCFLAGS", "RUSTDOCFLAGS=-D warnings", "cargo", "doc", "--manifest-path", "{module.manifest}", "{module.selector}", "--no-deps", "--document-private-items", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.format]
argv = ["cargo", "fmt", "--manifest-path", "{module.manifest}", "--all", "{args}"]
cacheable = false
fan_out = "whole-workspace"
# `cargo fmt --all` is a workspace-atomic invocation (see the coverage task's
# note) — co-schedulable across the facade cycle. Matches the adapter default.
workspace_closure = true
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.format-check]
argv = ["cargo", "fmt", "--manifest-path", "{module.manifest}", "--all", "--check", "{args}"]
fan_out = "whole-workspace"
workspace_closure = true
kind = "format"
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

# Lint, test, doctest, and doc are the full gates `make` runs: clippy and the
# test suites cover every feature, and warnings fail the run.
[ecosystems.rust.tasks.lint]
argv = ["cargo", "clippy", "--manifest-path", "{module.manifest}", "{module.selector}", "--all-targets", "--all-features", "{args}", "--", "-D", "warnings"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.run]
argv = ["cargo", "run", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "per-module"
persistent = true
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.test]
argv = ["cargo", "nextest", "run", "--no-tests=pass", "--manifest-path", "{module.manifest}", "{module.selector}", "--all-features", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

# `test` covers every feature; `test-default` runs the same suites with only the
# default features, so a feature-gated item the default build depends on cannot
# hide behind `--all-features`. The distinct name keeps it a separately cached
# unit until Toven grows task variants (docs/TOVEN-MIGRATION.md, gap 2).
[ecosystems.rust.tasks.test-default]
argv = ["cargo", "nextest", "run", "--no-tests=pass", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
kind = "test"
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

[ecosystems.rust.tasks.vuln]
argv = ["cargo", "audit", "--file", "{workspace.root}/Cargo.lock", "{args}"]
fan_out = "whole-workspace"
# `cargo audit` reads each workspace lockfile atomically — co-schedulable across
# the facade cycle. Matches the adapter default.
workspace_closure = true
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

# nextest (the `test` task) cannot execute documentation tests, so `doctest`
# runs `cargo test --doc`. A doctest is semantically a test, so `kind = "test"`
# reuses the Test kind (coverage/affected grouping) while the distinct name
# keeps it from colliding with the nextest `test` task.
[ecosystems.rust.tasks.doctest]
argv = ["cargo", "test", "--doc", "--manifest-path", "{module.manifest}", "{module.selector}", "--all-features", "{args}"]
fan_out = "batchable"
kind = "test"
selector = ["-p", "{module.package}"]
shared_inputs = ["contrib/Cargo.lock", "core/Cargo.lock", "examples/Cargo.lock"]

# Module groups are rskit's architectural layers (the former `domains.toml`).
# Each group names the layers it may depend on through
# `guardrails.allow_groups`; Toven validates every direct dependency edge against
# it, so a crate that reaches up a layer fails planning. `toven groups` lists
# them, `toven <task> --group <name>` selects them (`make check-<group>`), and
# `scripts/rskit_tool.py groups` renders the module index and layer diagram
# from `toven groups --output jsonl`.

[groups.core]
description = "Foundation types, config, logging, validation, encryption, filesystem utilities"
ecosystem = "rust"
modules = [
  "rskit-errors",
  "rskit-config",
  "rskit-logging",
  "rskit-validation",
  "rskit-encryption",
  "rskit-util",
  "rskit-fs",
  "rskit-version",
  "rskit-schema",
  "rskit-codec",
  "rskit-stream",
]
guardrails.allow_groups = []

[groups.patterns]
description = "Component lifecycle, provider shapes, DI, hooks"
ecosystem = "rust"
modules = [
  "rskit-component",
  "rskit-hook",
  "rskit-provider",
  "rskit-di",
]
guardrails.allow_groups = ["core"]

[groups.crosscutting]
description = "Observability, resilience, security"
ecosystem = "rust"
modules = [
  "rskit-observability",
  "rskit-resilience",
  "rskit-security",
]
guardrails.allow_groups = ["core", "patterns", "testing"]

[groups.composition]
description = "Bootstrap, DAG, chain, worker, process, stateful"
ecosystem = "rust"
modules = [
  "rskit-bootstrap",
  "rskit-dag",
  "rskit-chain",
  "rskit-worker",
  "rskit-process",
  "rskit-stateful",
]
guardrails.allow_groups = ["core", "patterns", "crosscutting", "testing"]

[groups.transport]
description = "Server, HTTP client, gRPC, SSE, connect, discovery"
ecosystem = "rust"
modules = [
  "rskit-server",
  "rskit-httpclient",
  "rskit-grpc",
  "rskit-sse",
  "rskit-http",
  "rskit-discovery",
]
guardrails.allow_groups = ["core", "patterns", "crosscutting", "composition", "testing"]

[groups.auth]
description = "Authentication and authorization"
ecosystem = "rust"
modules = [
  "rskit-auth",
  "rskit-authz",
]
guardrails.allow_groups = ["core", "patterns", "crosscutting", "transport", "testing"]

[groups.data]
description = "Database, cache, storage, vectorstore, messaging"
ecosystem = "rust"
modules = [
  "rskit-database",
  "rskit-database-sqlite",
  "rskit-cache",
  "rskit-cache-redis",
  "rskit-storage",
  "rskit-storage-gcs",
  "rskit-storage-s3",
  "rskit-storage-supabase",
  "rskit-vectorstore",
  "rskit-vectorstore-qdrant",
  "rskit-messaging",
  "rskit-messaging-kafka",
  "rskit-messaging-nats",
  "rskit-messaging-rabbitmq",
]
guardrails.allow_groups = ["core", "patterns", "crosscutting", "composition", "transport", "auth", "testing"]

[groups.ai]
description = "LLM, inference, embedding, agent, tool, MCP, skill"
ecosystem = "rust"
modules = [
  "rskit-ai",
  "rskit-llm",
  "rskit-llm-common",
  "rskit-llm-openai",
  "rskit-llm-anthropic",
  "rskit-llm-ollama",
  "rskit-llm-gemini",
  "rskit-llm-tiktoken",
  "rskit-llm-hf-tokenizers",
  "rskit-embedding",
  "rskit-inference",
  "rskit-inference-tgi",
  "rskit-inference-triton",
  "rskit-inference-vllm",
  "rskit-agent",
  "rskit-tool",
  "rskit-mcp",
  "rskit-skill",
]
guardrails.allow_groups = ["core", "patterns", "crosscutting", "transport", "auth", "testing"]

[groups.media]
description = "Media processing, transcription"
ecosystem = "rust"
modules = [
  "rskit-media",
  "rskit-media-audio",
  "rskit-media-ffmpeg",
  "rskit-media-image",
]
guardrails.allow_groups = ["core", "patterns", "crosscutting", "composition", "data", "testing"]

[groups.infra]
description = "CLI, benchmarking, dataset, git, workload"
ecosystem = "rust"
modules = [
  "rskit-bench",
  "rskit-cli",
  "rskit-dataset",
  "rskit-git",
  "rskit-workload",
]
guardrails.allow_groups = ["core", "patterns", "crosscutting", "composition", "ai", "testing"]

# Shared test fixtures. Every layer above `patterns` may take it as a
# dev-dependency; its optional `llm`/`embedding` features reach into `ai`, so it
# sits outside the layer stack rather than inside one layer.
[groups.testing]
description = "Shared test fixtures and fakes (dev-dependency only)"
ecosystem = "rust"
modules = ["rskit-testutil"]

# The `rskit` facade re-exports every layer behind feature flags.
[groups.facade]
description = "The rskit umbrella crate re-exporting every layer"
ecosystem = "rust"
modules = ["rskit-suite"]

[groups.examples]
description = "Runnable example applications"
ecosystem = "rust"
modules = ["agent-demo", "core-cli", "media-demo"]

# The `command` ecosystem is Toven's generic-tool adapter: tool-specific but
# language-agnostic gates that have no cargo home. Declaring rskit's structural
# and architectural guardrails here lets Toven drive the full validation gate,
# not just the cargo tasks. One module rooted at the repo root owns them all.
#
# The `check-*`/`module-index` gates wrap `scripts/rskit_tool.py`: their bespoke
# rules (L7 dependency edges, module topology, workspace dependency-version
# sync, public-API diff, the release-readiness sweep, and the generated module
# index) are rskit-specific policy that Toven orchestrates but does not itself
# implement. `structure` is the ast-grep declare-only `lib.rs`/`mod.rs` guard.
[[ecosystems.command.modules]]
name = "repo"
root = "."

[ecosystems.command.tasks.structure]
argv = ["ast-grep", "scan", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

[ecosystems.command.tasks.crowded-modules]
argv = ["scripts/rskit_tool.py", "check", "crowded-modules", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

[ecosystems.command.tasks.topology]
argv = ["scripts/rskit_tool.py", "check", "topology", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

[ecosystems.command.tasks.l7-edges]
argv = ["scripts/rskit_tool.py", "check", "l7-edges", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

[ecosystems.command.tasks.workspace-deps-sync]
argv = ["scripts/rskit_tool.py", "check", "workspace-deps-sync", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

[ecosystems.command.tasks.public-api]
argv = ["scripts/rskit_tool.py", "check", "public-api", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

[ecosystems.command.tasks.readiness]
argv = ["scripts/rskit_tool.py", "check", "readiness", "{args}"]
fan_out = "whole-workspace"
kind = "lint"

# `module-index` renders docs/MODULE-INDEX.md from `toven groups`.
[ecosystems.command.tasks.module-index]
argv = ["scripts/rskit_tool.py", "groups", "module-index", "{args}"]
fan_out = "whole-workspace"
kind = "doc"

# `sbom` renders the CycloneDX SBOMs across rskit's `--all-features` surface —
# the surface it validates and ships. Toven's native SBOM step omits
# `--all-features`, so the all-features wrapper stays owned by `rskit_tool`;
# Toven orchestrates it as a `command` task.
[ecosystems.command.tasks.sbom]
argv = ["scripts/rskit_tool.py", "sbom", "{args}"]
fan_out = "whole-workspace"
kind = "doc"

# `depgraphs` renders the group-layer and contrib dependency SVGs embedded in
# docs/DESIGN.md. The layer diagram reads `toven groups`; Graphviz rendering and
# the `cargo depgraph` crate view stay in `scripts/rskit_tool.py`.
[ecosystems.command.tasks.depgraphs]
argv = ["scripts/rskit_tool.py", "groups", "depgraphs", "{args}"]
fan_out = "whole-workspace"
kind = "doc"

# `sync-readme-versions` is the bump `on_resolved` hook target (see the
# `rust:rskit-suite` module block): during `toven release bump` Toven appends
# the resolved `key -> version` map path at `{args}` and this task rewrites the
# README install-snippet pins Toven's native `version_references` cannot express
# (table-attribute and column-aligned pins), staging them with the manifests.
# It mutates the working tree, so it is never cached.
[ecosystems.command.tasks.sync-readme-versions]
argv = ["scripts/rskit_tool.py", "sync-readme-versions", "{args}"]
cacheable = false
fan_out = "whole-workspace"
kind = "run"
